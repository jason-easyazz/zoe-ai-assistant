# =============================================================================
# Zoe Assistant - Docker Compose (Updated 2026-03-21)
# =============================================================================
# Active architecture:
#   - zoe-data: host-native uvicorn on :8000 (NOT in Docker)
#   - llama-server: host-native binary on :11434 (NOT in Docker)
#   - Docker services below: UI, auth, HA, bridges, cloudflared
# =============================================================================

# Bounded container logs (2026-10-04 log review; operator background in
# docs/knowledge/docker-log-and-memory-limits.md). Docker's default json-file driver has NO
# size cap: zoe-multica-backend alone was 621 MB after seven weeks. 3 x 10 MB per container
# is ~3 days of the noisiest service and keeps `docker logs` fast. This reaches a container
# only when it is (re)created; the daemon-wide default in daemon.json is the other half.
# Pinned for every service by tests/unit/test_compose_loopback_binds.py.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── UI ─────────────────────────────────────────────────────────────────────
  zoe-ui:
    image: nginx@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60  # nginx:1.31.8-alpine as of 2026-10-28 (14 Oct CVE fixes); same digest in deploy.yml + validate.yml (pinned by test_nginx_delivery_layer.py)
    container_name: zoe-ui
    ports:
    - 80:80
    - 443:443
    # Relay listener (panel-anywhere R1): host LOOPBACK only, for frpc on this host. Nothing listens behind it until
    # scripts/setup/relay/enable_relay_listener.py installs ssl/relay/listener.conf (connection refused until then).
    - 127.0.0.1:9443:9443
    volumes:
    - ./services/zoe-ui/dist:/usr/share/nginx/html
    # nginx.conf is a single-FILE mount: pinned to an inode, so a git sync that replaces the
    # file needs `docker restart zoe-ui` (deploy.yml does it). nginx.d/ is a DIRECTORY mount
    # (files are opened by path), holding the shared locations + security-header snippets.
    - ./services/zoe-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./services/zoe-ui/nginx.d:/etc/nginx/zoe:ro
    - ./ssl:/etc/nginx/ssl:ro
    extra_hosts:
    - "host.docker.internal:host-gateway"
    networks:
      zoe-network:
        aliases:
          - zoe.local
    restart: unless-stopped
    logging: *default-logging
    # Memory: a leak backstop, not a working limit (peak 71 MB; sizing in docs/knowledge/docker-log-and-memory-limits.md)
    mem_limit: 256m
    memswap_limit: 384m

  # ── Database ───────────────────────────────────────────────────────────────
  # PostgreSQL is required by zoe-auth and host-native zoe-data.
  #
  # IMAGE: pinned by DIGEST to pgvector/pgvector:0.8.6-pg17 (built 2026-08-13 =
  # PostgreSQL 17.11 + pgvector 0.8.6). Was the floating `pg17` tag, which on the box
  # was a 2026-05-15 image carrying PostgreSQL 17.10 — 17.11 (2026-08-13) closes ~25
  # CVEs, several CVSS 8.8 code-execution bugs that need only a login (e.g.
  # CVE-2026-14662/-14664/-14669/-14680/-15742/-16239, CVE-2026-14679).
  # 17.10 → 17.11 is a MINOR upgrade: same on-disk format, so recreating the container on
  # the existing zoe-database-data volume is the whole upgrade (no dump/restore, no
  # pg_upgrade). pgvector 0.8.2 → 0.8.6: the new shared library loads on start; the
  # 0.8.2→0.8.6 extension update scripts are catalog-only no-ops, so
  # `ALTER EXTENSION vector UPDATE;` (in `multica`, the only database with `vector`)
  # merely bumps extversion — run it for bookkeeping, nothing depends on it. The
  # HNSW-vacuum corruption fixes in 0.8.3/0.8.4 do not apply here: no hnsw/ivfflat index
  # exists in any database (checked 2026-09-27). TO BUMP: `docker pull` the new tag, read
  # `docker image inspect --format '{{index .RepoDigests 0}}'`, update the line below.
  # Stay on pg17 — a major version needs dump/restore or pg_upgrade.
  zoe-database:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: zoe-database
    environment:
    - POSTGRES_DB=zoe
    - POSTGRES_USER=zoe
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # LOOPBACK ONLY. A bare "5432:5432" publishes on 0.0.0.0 + [::], and pg_hba allows
    # `host all all all scram-sha-256`, so every LAN host could attempt a login. Nothing
    # needs the LAN: host-native zoe-data (and every other host-side client) connects via
    # localhost:5432, which on this box resolves to 127.0.0.1 only; containers use the
    # Docker network name `zoe-database:5432` (zoe-auth, multica-backend). A container
    # must NOT use host.docker.internal:5432 — that is the docker0 gateway, not loopback,
    # and cannot reach this publish. Pinned by tests/unit/test_compose_loopback_binds.py.
    ports:
    - "127.0.0.1:5432:5432"
    volumes:
    - zoe-database-data:/var/lib/postgresql/data
    networks:
    - zoe-network
    restart: unless-stopped
    logging: *default-logging
    # NO memory cap, deliberately (B9, 2026-10-18; tests/unit/test_ops_hygiene_b9.py lists the exemption): an
    # OOM kill here is an outage of every data path plus crash recovery - the zoe-data MemoryMax argument. Peak 217 MB
    # against 128 MB shared_buffers; revisit with pg_stat_statements (docs/knowledge/docker-log-and-memory-limits.md).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoe"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth ───────────────────────────────────────────────────────────────────
  zoe-auth:
    build: ./services/zoe-auth
    container_name: zoe-auth
    ports:
    - 8002:8002
    volumes:
    - ./data:/app/data
    networks:
    - zoe-network
    restart: unless-stopped
    logging: *default-logging
    # Memory: a leak backstop, not a working limit (peak 83 MB; sizing in docs/knowledge/docker-log-and-memory-limits.md)
    mem_limit: 256m
    memswap_limit: 384m
    depends_on:
      zoe-database:
        condition: service_healthy
    environment:
    - PYTHONUNBUFFERED=1
    - DATABASE_PATH=/app/data/zoe.db
    - POSTGRES_URL=postgresql://zoe:${POSTGRES_PASSWORD}@zoe-database:5432/zoe
    - ZOE_BASE_URL=${ZOE_BASE_URL:-http://zoe.local}
    - HA_OIDC_CLIENT_ID=${HA_OIDC_CLIENT_ID:-home-assistant}
    - HA_OIDC_CLIENT_SECRET=${HA_OIDC_CLIENT_SECRET:-}
    - MULTICA_OIDC_CLIENT_ID=${MULTICA_OIDC_CLIENT_ID:-multica}
    - MULTICA_OIDC_CLIENT_SECRET=${MULTICA_OIDC_CLIENT_SECRET:-}
    - OMNIGENT_OIDC_CLIENT_ID=${OMNIGENT_OIDC_CLIENT_ID:-omnigent}
    - OMNIGENT_OIDC_CLIENT_SECRET=${OMNIGENT_OIDC_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Home Assistant ─────────────────────────────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133  # 2026.10.4 (released 2026-10-24; multi-arch index digest, arm64 included, verified 2026-10-28). A REAL pin, not :stable. Bump deliberately per docs/knowledge/ha-2026-9-upgrade-runbook.md; hold 2026.11.x (Marketplace replaces HACS, MFA opt-in touches auth_oidc).
    container_name: homeassistant
    restart: unless-stopped
    logging: *default-logging
    # Memory: a leak backstop, not a working limit (peak 453 MB; an HA upgrade's first start spikes; sizing in docs/knowledge/docker-log-and-memory-limits.md)
    mem_limit: 1536m
    memswap_limit: 2304m
    ports:
    - 8123:8123
    volumes:
    - ./homeassistant:/config
    environment:
    - TZ=Australia/Perth
    networks:
    - zoe-network

  homeassistant-mcp-bridge:
    build: ./services/homeassistant-mcp-bridge
    container_name: homeassistant-mcp-bridge
    restart: unless-stopped
    logging: *default-logging
    # Memory: a leak backstop, not a working limit (peak 53 MB; sizing in docs/knowledge/docker-log-and-memory-limits.md)
    mem_limit: 256m
    memswap_limit: 384m
    # LOOPBACK ONLY. The bridge has NO inbound auth — on 0.0.0.0 any LAN host could drive
    # Home Assistant through it. Every consumer is host-local or on zoe-network:
    # zoe-data uses ZOE_HA_BRIDGE_URL=http://127.0.0.1:8007; Home Assistant calls
    # http://homeassistant-mcp-bridge:8007 over zoe-network (configuration.yaml,
    # custom_components/zoe_conversation), which never touches the published port; the
    # healthcheck runs inside the container. Pinned by
    # tests/unit/test_compose_loopback_binds.py.
    ports:
    - "127.0.0.1:8007:8007"
    volumes:
    - ./services/homeassistant-mcp-bridge:/app
    environment:
    - PYTHONUNBUFFERED=1
    - HA_BASE_URL=${HA_BASE_URL:-http://homeassistant:8123}
    - HA_ACCESS_TOKEN=${HA_ACCESS_TOKEN:-}
    - ZOE_HA_VOICE_INGRESS_URL=${ZOE_HA_VOICE_INGRESS_URL:-http://host.docker.internal:8000}
    - ZOE_HA_VOICE_TOKEN=${ZOE_HA_VOICE_TOKEN:-}
    networks:
    - zoe-network
    extra_hosts:
    - "host.docker.internal:host-gateway"
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8007/
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - .env

  # ── Wyoming Voice Services (HA Assist integration only) ───────────────────
  #
  # ARCHITECTURE NOTE (2026-04):
  # Zoe now runs TWO parallel voice stacks:
  #
  # 1. NATIVE STACK (primary, active for Zoe touch panel):
  #    - Wake word:   openWakeWord ONNX model on Pi daemon (zoe_voice_daemon.py)
  #    - STT:         Moonshine v2 Medium in zoe-data (/api/voice/transcribe)
  #    - TTS:         Kokoro sidecar → Edge TTS → espeak-ng waterfall (/api/voice/synthesize)
  #    - Barge-in:    Silero VAD on Pi during TTS playback
  #    - Speaker ID:  WeSpeaker ResNet34 256-dim embeddings on Pi
  #    This stack is NOT in Docker — the Pi daemon runs as a systemd service.
  #
  # ── LiveKit WebRTC server (for remote "Her"-style voice via /voice?mode=livekit) ──────────────
  livekit:
    # PINNED (was :latest): the exact image the box runs — v1.9.3, multi-arch index digest
    # read from `docker image inspect` (RepoDigests) on 2026-10-18. Bump both together.
    image: livekit/livekit-server:v1.9.3@sha256:75484e317a90991f5e7a8edbc2eb1ee92f690e440c5b7d88a2713b5fa70f368a
    container_name: livekit
    restart: unless-stopped
    logging: *default-logging
    # ON DEMAND, not dead: zoe-data `docker start`s it on the first /livekit-token and stops it
    # after ZOE_LIVEKIT_IDLE_TIMEOUT_S (300 s) with nobody in the room (routers/voice_livekit.py).
    # Memory cap: measured 18-19 MiB RSS idle (docker stats, 2026-10-18); the long-quoted
    # "~560 MB" was never a measurement. 512m is ~27x idle for a room of a few audio tracks, and
    # memswap = mem keeps it out of swap on the shared 15.6 GB box. Under-sized shows up as an
    # OOM kill in `docker inspect livekit` (.State.OOMKilled) - raise it then, with that evidence.
    mem_limit: 512m
    memswap_limit: 512m
    command: --config /config.yaml
    environment:
    # The API key pair is NOT in the tracked config.yaml — it comes from the
    # untracked repo-root .env, the authoritative home for Zoe's secrets.
    # Format is exact: "<key>: <secret>", including the space (livekit-server
    # yaml-unmarshals this string; without the space it errors out).
    # QUOTING IS LOAD-BEARING: unquoted, `- FOO=a: b` is a YAML *mapping*, not
    # the env string we want.
    # NOT `:?` (required-value). Compose interpolates the WHOLE model before it
    # selects services, so a required marker here aborts every compose command
    # on a box without the pair — measured: `docker compose config zoe-auth`
    # with no LiveKit vars exits 15 with "required variable LIVEKIT_API_KEY is
    # missing a value". That would break `install-jetson.sh` on a fresh box (it
    # copies .env.example, then brings up the non-LiveKit spine) and deploy.yml's
    # `docker compose up -d zoe-auth`. An optional service's credential must not
    # be able to take down the whole file. Empty is still LOUD, just correctly
    # scoped: livekit-server refuses to serve — "Could not parse keys, it needs
    # to be exactly, \"key: secret\"" — verified against v1.9.3, the same class
    # of refusal as supplying no keys at all. Provisioning lives in .env.example
    # + docs/knowledge/livekit-key-rotation.md.
    - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    ports:
    - "7880:7880"
    - "50000-50200:50000-50200/udp"
    volumes:
    - ./services/livekit/config.yaml:/config.yaml:ro
    networks:
    - zoe-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. WYOMING STACK (retired 2026-05-10):
  #    wyoming-piper TTS was replaced by Kokoro GPU sidecar — retired to save ~2GB RAM.
  #    wyoming-whisper: HA satellite STT experiment abandoned (quality insufficient).
  #    wyoming-openwakeword: OOM-killed May 2026, not configured in any active pipeline.
  # wyoming-whisper: disabled — HA satellite STT experiment abandoned (quality insufficient).
  # wyoming-openwakeword: disabled — OOM-killed May 2026, not configured in any active pipeline.
  # Do not re-enable Wyoming Whisper; Moonshine is the canonical STT rock.
  #
  # wyoming-openwakeword:
  #   image: rhasspy/wyoming-openwakeword:latest
  #   container_name: wyoming-openwakeword
  #   restart: unless-stopped
  #   command: --preload-model ok_nabu --threshold 0.08 --trigger-level 0 --uri tcp://0.0.0.0:10400 --debug --debug-probability
  #   ports:
  #   - 10400:10400
  #   volumes:
  #   - ./data/wyoming/openwakeword:/data
  #   networks:
  #   - zoe-network

  # ── Keeper.sh Calendar Sync ────────────────────────────────────────────────
  keeper:
    image: ghcr.io/ridafkih/keeper.sh:latest
    container_name: zoe-keeper
    restart: unless-stopped
    logging: *default-logging
    profiles:
    - keeper
    ports:
    - 8787:8787
    environment:
    - KEEPER_HOST=0.0.0.0
    - KEEPER_PORT=8787
    - KEEPER_BASE_URL=${KEEPER_BASE_URL:-http://zoe-keeper:8787}
    - KEEPER_AUTH_TOKEN=${KEEPER_AUTH_TOKEN:-}
    - KEEPER_DATA_DIR=/data
    volumes:
    - ./data/keeper:/data
    networks:
    - zoe-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    env_file:
    - .env

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07  # cloudflared 2026.10.0 (released 2026-10-05; registry index digest verified 2026-10-28). Bump deliberately, never :latest.
    container_name: zoe-cloudflared
    command: --config /etc/cloudflared/config.yml --no-autoupdate tunnel run
    restart: unless-stopped
    logging: *default-logging
    # Memory: a leak backstop, not a working limit (peak 41 MB; sizing in docs/knowledge/docker-log-and-memory-limits.md)
    mem_limit: 256m
    memswap_limit: 384m
    profiles:
    - cloudflare
    volumes:
    - ./config/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
    - ./config/d417c04a-babc-48e4-85e6-a9badc20a7a6.json:/etc/cloudflared/d417c04a-babc-48e4-85e6-a9badc20a7a6.json:ro
    - ./config/cert.pem:/etc/cloudflared/cert.pem:ro
    networks:
    - zoe-network
    extra_hosts:
    - "host.docker.internal:host-gateway"

  # ═══════════════════════════════════════════════════════════════════════════
  # RETIRED SERVICES (kept commented for reference)
  # These were replaced by host-native services + OpenClaw (March 2026)
  # ═══════════════════════════════════════════════════════════════════════════

  # zoe-core (old Docker monolith): RETIRED - Replaced by zoe-data (host uvicorn :8000) + OpenClaw gateway.
  #   NOTE: the name "zoe-core" is now REUSED for the new Pi-agent core (services/zoe-core/), the reasoning
  #   brain on Gemma 4. That new service is defined separately — this comment refers only to the old monolith.
  # zoe-litellm: RETIRED - OpenClaw handles model routing (GPT-4o-mini / Gemini Flash / local Hermes)
  # zoe-llamacpp: RETIRED - Native llama-server on host :11434 (Gemma 4 E4B-QAT+MTP)
  # zoe-mcp-server: RETIRED - OpenClaw native tool system
  # zoe-mem-agent: RETIRED - OpenClaw memory-memu plugin
  # zoe-code-execution: RETIRED - OpenClaw exec tool
  # zoe-whisper: RETIRED - Voice pipeline not active
  # zoe-tts: RETIRED - Voice pipeline not active
  # zoe-voice-agent: RETIRED - Voice pipeline not active
  # livekit: ACTIVE - see livekit service block above (voice.html WebRTC mode)
  # zoe-tensorrt: RETIRED - Not needed with GGUF models
  # vLLM: RETIRED - Blocked by PyTorch CUDA allocator bug
  # people-service: RETIRED - Merged into zoe-data
  # collections-service: RETIRED - Merged into zoe-data
  # matrix-mcp-server: RETIRED - Never activated
  # zoe-redis: RETIRED - No active consumers (March 2026)
  # zoe-n8n + n8n-mcp-bridge: RETIRED - OpenClaw cron/skills/exec covers all automation (March 2026)

networks:
  zoe-network:
    name: zoe-network
    driver: bridge

volumes:
  zoe-database-data: {}
