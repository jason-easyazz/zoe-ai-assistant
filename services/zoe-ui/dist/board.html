<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7B61FF">
    <title>Zoe – Engineering board</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <!-- auth.js sends a visitor with no member session to sign in, then back here. -->
    <script src="/js/auth.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; margin: 0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; background: #f6f5fb; color: #1d1b26; }
        @media (prefers-color-scheme: dark) { body { background: #16151c; color: #ecebf2; } }
        main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
        h1 { font-size: 1.4rem; font-weight: 500; margin: 0 0 .75rem; }
        p { line-height: 1.5; margin: 0 0 1rem; opacity: .85; }
        a { color: #7B61FF; }
    </style>
</head>
<body>
<main>
    <h1 id="title">Opening the board…</h1>
    <p id="msg">Checking your Zoe sign-in.</p>
    <p><a href="/dashboard.html">Back to Zoe</a></p>
</main>
<script>
    // The Multica board sits behind Zoe's sign-in (nginx auth_request -> /api/multica-ui/gate). A navigation cannot carry
    // our X-Session-ID header, so trade it for the board's path-scoped HttpOnly cookie, then go to the board.
    // ?next= comes from nginx's redirect but is attacker-controllable: only a same-origin /multica/ path is followed.
    function boardTarget(raw, origin) {
        const fallback = '/multica/';
        const t = String(raw == null ? '' : raw).trim();
        if (!t || /[\\\u0000-\u001f]/.test(t)) return fallback;
        let u;
        try { u = new URL(t, origin); } catch (_) { return fallback; }
        if (u.origin !== origin || !u.pathname.startsWith('/multica/') || u.pathname.startsWith('//')) return fallback;
        return u.pathname + u.search + u.hash;
    }

    async function openBoard() {
        if (window.__zoeAuthRedirecting) return;   // auth.js is already sending us to sign in
        const title = document.getElementById('title'), msg = document.getElementById('msg');
        let r;
        try {
            // Explicit, not left to auth.js's fetch interceptor: this call is the whole point of the page.
            let sid = '';
            try { sid = String((JSON.parse(localStorage.getItem('zoe_session') || '{}') || {}).session_id || ''); } catch (_) {}
            r = await fetch('/api/multica-ui/session', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session-ID': sid } });
        } catch (_) {
            title.textContent = 'Zoe is not answering';
            msg.textContent = 'Try again in a moment.';
            return;
        }
        if (r.ok) {
            location.replace(boardTarget(new URLSearchParams(location.search).get('next'), location.origin));
            return;
        }
        if (r.status === 401) {
            try { sessionStorage.setItem('zoe_redirect_after_login', location.pathname + location.search); } catch (_) {}
            location.replace('/index.html');
            return;
        }
        if (r.status === 403) {
            title.textContent = 'The board is for adult household members';
            msg.textContent = 'Your Zoe account cannot open it. Ask the household admin if that is wrong.';
            return;
        }
        title.textContent = 'The board could not be opened';
        msg.textContent = 'Zoe answered ' + r.status + '. Try again in a moment.';
    }
    openBoard();
</script>
</body>
</html>
