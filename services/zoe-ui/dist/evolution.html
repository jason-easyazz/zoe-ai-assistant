<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
    (function(){var s=localStorage.getItem('zoe_theme')||'auto';var dark=s==='dark'||(s==='auto'&&(new Date().getHours()<7||new Date().getHours()>=19));if(dark){document.documentElement.classList.add('dark-mode');}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7B61FF">
    <title>Zoe – Proposals</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <script src="/js/sw-registration.js" defer></script>
    <link rel="stylesheet" href="css/dark-mode-shared.css">
    <script src="/js/auth.js"></script>
    <style>
        :root { --p-bg: #fafbfc; --p-card: #ffffff; --p-text: #1f2937; --p-muted: #6b7280; --p-line: rgba(0,0,0,0.08);
                --p-accent: #7B61FF; --p-accent-soft: rgba(123,97,255,0.12); --p-bad: #dc2626; }
        html.dark-mode { --p-bg: #060610; --p-card: #111122; --p-text: rgba(255,255,255,0.93); --p-muted: rgba(255,255,255,0.6);
                         --p-line: rgba(255,255,255,0.1); --p-accent-soft: rgba(123,97,255,0.22); --p-bad: #f87171; }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--p-bg); color: var(--p-text); }
        .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
               background: var(--p-bg); border-bottom: 1px solid var(--p-line); }
        .top h1 { margin: 0; font-size: 20px; flex: 1; }
        .top a { color: var(--p-accent); text-decoration: none; font-size: 15px; }
        main { max-width: 760px; margin: 0 auto; padding: 8px 16px 64px; }
        h2 { font-size: 17px; margin: 24px 0 8px; }
        h3 { font-size: 17px; margin: 0 0 6px; line-height: 1.35; }
        .card { background: var(--p-card); border: 1px solid var(--p-line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
        .line { margin: 4px 0; font-size: 15px; }
        .meta, .hint { color: var(--p-muted); font-size: 14px; margin: 4px 0; }
        .empty { color: var(--p-muted); font-size: 15px; }
        .chip { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px; background: var(--p-accent-soft); }
        .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .pb { flex: 1 1 30%; min-height: 52px; min-width: 88px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--p-line);
              background: var(--p-card); color: var(--p-text); font-size: 16px; cursor: pointer; }
        .pb.primary { background: var(--p-accent); border-color: var(--p-accent); color: #fff; }
        .pb.danger { background: var(--p-bad); border-color: var(--p-bad); color: #fff; }
        .pb[disabled] { opacity: .5; }
        .foot { margin-top: 28px; padding: 12px 14px; border-radius: 12px; background: var(--p-accent-soft); font-size: 14px; }
        .toast { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px 14px; border-radius: 12px; background: #111827;
                 color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
        .toast.show { opacity: 1; }
        .toast.bad { background: var(--p-bad); }
    </style>
</head>
<body>
    <div class="top">
        <a href="settings.html">← Settings</a>
        <h1>Zoe's proposals</h1>
    </div>
    <main>
        <p class="hint">What Zoe noticed and would like to change. Similar proposals are grouped; the strongest and newest come first.</p>
        <div id="evoCards" aria-live="polite"><p class="empty">Loading…</p></div>
        <h2>Old proposals</h2>
        <div id="evoStale"></div>
        <h2>Past decisions</h2>
        <div id="evoPast"></div>
        <p class="foot" id="evoFooter">Today a yes only records your decision.</p>
    </main>
    <div class="toast" id="evoToast" role="status"></div>
    <script src="/js/evolution-page.js?v=1"></script>
    <script>
        // auth.js's synchronous desktop gate may already be redirecting to sign-in: send nothing from this page meanwhile
        if (window.ZoeEvolution && !window.__zoeAuthRedirecting) window.ZoeEvolution.init(document);
    </script>
</body>
</html>
