# Zoe UI — default server for the zoe-ui container (mounted as /etc/nginx/conf.d/default.conf,
# which nginx's stock nginx.conf includes inside http{}). The body of both server blocks is
# ONE shared file, nginx.d/locations.inc, and the security headers are ONE shared file,
# nginx.d/security-headers.inc — both mounted at /etc/nginx/zoe/ by docker-compose.yml.
# Edit those, not copies. /api/* goes to zoe-data on the host, zoe-auth routes to the
# zoe-auth container, /modules/music-assistant/* to the Music Assistant host service.
#
# OPERATIONS: this file is a single-file bind mount pinned to an inode — a `git` sync
# replaces the file, so the running master keeps the OLD one and `nginx -s reload` re-reads
# the OLD one too. A change here needs `docker restart zoe-ui` (deploy.yml does it).
# Pre-check a change with:  docker run --rm --add-host zoe-auth:127.0.0.1 \
#   --add-host host.docker.internal:127.0.0.1 -v $PWD/services/zoe-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#   -v $PWD/services/zoe-ui/nginx.d:/etc/nginx/zoe:ro -v $PWD/ssl:/etc/nginx/ssl:ro nginx:alpine nginx -t

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HSTS only over TLS: on :80 this is "" and nginx skips the empty add_header.
map $scheme $zoe_hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
}

# Access-log hygiene (2026-10-04 log review). The kiosk and every open browser tab poll a
# fixed set of cheap read endpoints about once a second (measured: ~100 log lines/minute from
# ONE panel, ~90 MB of zoe-ui log in weeks, all "200"). A successful poll carries no signal;
# a failed one (502 while zoe-data restarts, 4xx auth) is exactly the line worth keeping, so
# only successful answers to the closed list below are skipped and EVERY other status, method
# or path is still logged. The key is "<method>:<status>:<uri>" ($uri has no query string).
# The METHOD is part of the key on purpose: a PUT to /api/panels/<id>/config or
# /api/system/display/preferences shares its URI with a polled GET and is a user action,
# which must stay in the log as the audit trail. Only GET reads are skipped, plus the one
# periodic POST heartbeat (/api/ui/state/sync). Add a path here only if it is a periodic poll.
map "$request_method:$status:$uri" $zoe_log_access {
    default 1;
    "~^GET:(200|204|304):/api/(ui/actions/pending|voice/announcements|system/display/preferences|music/now-playing|skybridge/timers|ha/entities|panels/[^/]+/config)$" 0;
    "~^POST:(200|204):/api/ui/state/sync$" 0;
}

# Compression. text/html is always included. Streams are excluded by type
# (text/event-stream, application/x-ndjson are not listed) AND by `gzip off`
# in the /api/, /ws/, /livekit/ and /multica-api/ locations.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log main if=$zoe_log_access;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/zoe/security-headers.inc;
    include /etc/nginx/zoe/locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log main if=$zoe_log_access;

    ssl_certificate /etc/nginx/ssl/zoe.crt;
    ssl_certificate_key /etc/nginx/ssl/zoe.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/zoe/security-headers.inc;
    include /etc/nginx/zoe/locations.inc;
}
