# Zoe RELAY LISTENER (panel-anywhere phase R1; design docs/architecture/panel-anywhere.md sections 3 and 5; wire contract
# labs/relay/README.md "Interface for the R1 PR"). DISABLED BY DEFAULT: this file is NOT included by nginx.conf. It is copied to
# ssl/relay/listener.conf by `scripts/setup/relay/enable_relay_listener.py` ONLY when ssl/relay/{ca.pem,leaf.pem,leaf.key} exist
# and ZOE_RELAY_INGRESS is set - nginx.conf includes `/etc/nginx/ssl/relay/*.conf`, a glob that matches nothing on a box without
# the relay, so nginx never fails to start there.
#
# What it is: frpc (on the host, from the relay) connects to 127.0.0.1:9443 (docker-compose publishes it to host loopback ONLY),
# sending PROXY protocol v2 first. TLS terminates HERE, on the box; the relay only ever saw ciphertext.
#
#   * TLS 1.3 only; the leaf is for <hid>.zoe.internal from the HOUSEHOLD CA (never a public CA).
#   * `ssl_verify_client on` against the same CA, NO optional phase: a connection without a certificate this CA signed gets no
#     further than nginx (400, or dropped by the 444 check below). The lab finding: nginx completes the handshake and then
#     answers 400 itself; nothing reaches zoe-data either way.
#   * X-Zoe-Ingress: relay and X-Zoe-Client-Cert-Fp (the verified certificate's SHA-1) are set ABSOLUTELY, through the same
#     variables the LAN blocks leave empty (ingress-lan.inc), so a client-sent copy is overwritten.
#   * NO ADDRESS: X-Real-IP and X-Forwarded-For are empty. `$proxy_protocol_addr` (the relay client's private address) is
#     deliberately never forwarded: an address is not an identity (design rule 5), and zoe-data refuses to use one for a relayed request.
#   * Services with no Zoe auth of their own (Music Assistant, Multica, the Home Assistant UI, LiveKit signalling) 404 here
#     (lan-only.inc). WebRTC cannot cross the relay, so the LiveKit token route answers "not available" itself.
#
# Disable again: `enable_relay_listener.py --disable`, then `docker restart zoe-ui`.

server {
    listen 9443 ssl proxy_protocol;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log main if=$zoe_log_access;

    ssl_certificate /etc/nginx/ssl/relay/leaf.pem;
    ssl_certificate_key /etc/nginx/ssl/relay/leaf.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:RELAYSSL:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_client_certificate /etc/nginx/ssl/relay/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

    # Belt and braces: whatever a future edit does to ssl_verify_client, only a VERIFIED certificate gets past this line.
    if ($ssl_client_verify != SUCCESS) {
        return 444;
    }

    set $zoe_ingress "relay";
    set $zoe_client_cert_fp $ssl_client_fingerprint;
    set $zoe_real_ip "";
    set $zoe_xff "";

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/zoe/security-headers.inc;

    # The auth_request target of the zoe-auth locations (auth-gate.inc): zoe-data answers 204 only for a request that proved a bound
    # client certificate AND a device credential for the same panel (relay_ingress); zoe-auth itself knows nothing about either.
    location = /__zoe_auth_gate {
        internal;
        proxy_pass http://host.docker.internal:8000/api/relay/check;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zoe_real_ip;
        proxy_set_header X-Forwarded-For $zoe_xff;
        include /etc/nginx/zoe/ingress-headers.inc;
    }

    # WebRTC (LiveKit) cannot cross the relay (no TURN), so say so instead of minting a token the panel cannot use.
    location = /api/voice/livekit-token {
        include /etc/nginx/zoe/security-headers.inc;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"token":"","url":"","livekit_available":false}';
    }

    include /etc/nginx/zoe/locations.inc;
}
