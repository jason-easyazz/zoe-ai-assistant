port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
  # For local network access, we need to announce the local IP
  # LiveKit will auto-detect it from the host
# API keys are DELIBERATELY ABSENT from this tracked file.
# They are supplied at runtime via the LIVEKIT_KEYS env var (see docker-compose.yml),
# sourced from the untracked repo-root .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET).
# livekit-server v1.9.3: `--keys` / $LIVEKIT_KEYS is applied AFTER this file and
# replaces any `keys:` here; with neither, the server refuses to start
# ("one of key-file or keys must be provided"). Rotation runbook:
# docs/knowledge/livekit-key-rotation.md
logging:
  level: info
  sample: false
