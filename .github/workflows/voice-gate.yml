# The voice replay gate, promoted to a PR-TIME REQUIRED check.
#
# WHY IT MOVED LEFT: the replay gate used to run ONLY post-merge (deploy.yml and
# scripts/maintenance/deploy_live.sh), fail-closed. That left a real gap — a
# voice-path PR could go green, merge, and then be permanently REFUSED by the
# deploy gate: a "green main that will not deploy", discovered after the fact,
# with the change already on the trunk. Asserting the same thing before the merge
# closes it. The deploy-side assertion STAYS (defence in depth, and it is the last
# thing standing between an unproven voice path and Jason's actual house).
#
# ============================ TRUST MODEL (read this) ========================
# A pull request is UNTRUSTED INPUT. This workflow runs a job on `self-hosted` —
# the Jetson that also runs the live voice brain — so "untrusted" here means
# "arbitrary code execution on the production box" if it is got wrong.
#
#   * THE WORKFLOW DEFINITION ITSELF COMES FROM THE BASE REF. That is what
#     `pull_request_target` buys, and it is the whole reason for the trigger. On a
#     plain `pull_request` trigger GitHub runs the workflow file FROM THE PR HEAD
#     — so a PR could edit this very file to delete the fork gate, repoint the
#     checkout at its own head, or simply make the verdict `exit 0`, and thereby
#     author the required check that is supposed to gate it. The privileged
#     decision has to live somewhere the PR under review cannot redefine.
#   * `pull_request_target` is DANGEROUS BY DEFAULT and safe here for exactly one
#     reason: it runs with a write token and repository secrets, and we never
#     check out or execute a single byte the PR author controls. Every checkout
#     below pins `base.sha`. If you ever add a step that fetches the head ref,
#     runs `npm install`, or executes a script from the PR tree, this trigger
#     turns into remote code execution WITH a write token. Do not.
#   * THE REQUIRED CONTEXT IS PUBLISHED, NOT INFERRED FROM A JOB NAME. A
#     `pull_request_target` run is associated with the BASE commit, so a job
#     called `voice-gate` would report against the wrong SHA and the PR would wait
#     forever for a context that never arrives. The `verdict` job therefore
#     publishes a check run explicitly named `voice-gate` against
#     `pull_request.head.sha`. That also removes all ambiguity about which commit
#     the verdict is about.
#
#   * NOTHING from the PR head is ever CHECKED OUT or EXECUTED. Not on the
#     self-hosted runner, and not on the hosted one either. Both jobs check out
#     `github.event.pull_request.base.sha` — code that is already merged and
#     reviewed — and run the checker from THAT tree.
#   * The pull request enters only as DATA: a changed-file list fetched from the
#     GitHub API, and a 40-hex head SHA. Reading a filename can do nothing;
#     running the PR's own copy of the checker could do anything.
#   * Two distinct attacks are closed by the same rule. (a) BYPASS: a PR that
#     edits voice_gate_check.py to print `voice=false` would have waved itself
#     through, because the gate was running the PR's own classifier. (b) RCE: a
#     fork PR touching any voice-path file would have executed its own
#     voice_gate_check.py on the Jetson.
#   * FORK PRs additionally cannot reach the self-hosted runner at all without an
#     explicit maintainer action — see `replay-evidence`'s `if:`. Defence in
#     depth: even with only trusted code executing, a fork should not be able to
#     make the production box do work on demand.
#
# If you add a step here, the question to ask is not "is this safe?" but "does
# this read, write, or execute anything the PR author controls?"
# =============================================================================
#
# WHY IT IS SAFE AS A UNIVERSAL REQUIRED CONTEXT: `voice-gate` runs on EVERY PR
# and ALWAYS reports a conclusion. On a PR that touches no voice-path file it
# passes trivially and never involves the Jetson. Only a voice-path diff
# escalates to the real assertion. This is deliberate: a required context that
# reports on only SOME PRs is worse than no gate — GitHub blocks forever waiting
# for a check that will never arrive (which is why `paths:` filters are absent
# here; a path-filtered workflow simply does not report on unmatched PRs).
#
# WHERE THE EVIDENCE LIVES: the replay-gate artifact is written on the Jetson by
# scripts/maintenance/voice_regression_probe.py (~/.cache/zoe/*.json). A hosted
# runner cannot see it and never will, so the assertion step runs on the
# self-hosted runner. It only READS a small JSON file — it never loads Kokoro, so
# it does not need the memory-headroom gate that self-hosted-tests.yml needs.
name: voice-gate

on:
  # pull_request_TARGET, deliberately — see TRUST MODEL above. The definition is
  # read from the base ref, so the PR under review cannot rewrite its own gate.
  pull_request_target:
    # `edited` is not decoration: it is the event GitHub fires when a PR's BASE
    # BRANCH changes. A retarget changes the diff without moving the head SHA, so
    # without it a PR could be re-based onto a target where its diff DOES touch
    # voice while carrying a scope verdict computed against the old base.
    # `labeled` re-runs the gate when a maintainer approves a fork PR for the
    # self-hosted job (see `replay-evidence`).
    types: [opened, synchronize, reopened, edited, labeled]
  # NOTE: no `merge_group:` trigger. The verdict is published against
  # `pull_request.head.sha`, and a merge_group event has no pull request — so a
  # merge_group run could not publish the required context and the queue would
  # stall. Merge queues are NOT available to this repo (org-owned only, verdict
  # 2026-07-27, see merge-queue-switch.md), so this costs nothing today. If one
  # ever becomes available, give this workflow a merge_group path that publishes
  # against the queue ref BEFORE enabling it.
  workflow_dispatch:

# LEAST PRIVILEGE, PER JOB. `checks: write` is the capability to publish the
# required context — i.e. to satisfy the merge gate — so it is granted ONLY to
# `verdict`, and never at workflow level. The self-hosted job in particular runs
# on the Jetson and gets a READ-ONLY token: a write-capable token sitting on a
# long-lived production box is a standing risk that job has no use for.
# `permissions:` here is the restrictive DEFAULT; every job re-declares what it
# actually needs, because a job-level block replaces this wholesale.
permissions:
  contents: read

concurrency:
  group: voice-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- scope ----
  # Hosted, cheap, runs on every PR. Decides ONLY "does this change touch the
  # voice runtime path" — it never reads the artifact and never blocks. The
  # voice-path glob set lives in scripts/maintenance/voice_gate_check.py so the PR
  # gate and the deploy gate can never disagree about what "voice path" means.
  #
  # TRUSTED CODE, UNTRUSTED DATA: the checker comes from the BASE commit; the
  # changed-file list comes from the API. The PR's own tree is never fetched.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read          # checkout of the BASE commit
      pull-requests: read     # the changed-file list, as data
    outputs:
      voice: ${{ steps.scope.outputs.voice }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - name: Check out the BASE commit (trusted code only)
        uses: actions/checkout@v4
        with:
          # NOT the PR head, and NOT the default merge ref — both contain code the
          # PR author controls. `base.sha` is already on the target branch.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          # No git history needed any more: the changed-file list comes from the
          # API rather than `git diff`, which also removes the shallow-clone trap.
          fetch-depth: 1
          # Do not leave a usable credential on the runner for later steps.
          persist-credentials: false

      - name: Fetch the changed-file list (data, not code)
        id: files
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --paginate: a truncated file list would silently read as "no voice
          # files changed" on a large PR — the exact false-clear this gate exists
          # to prevent.
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
            --jq '.[].filename' > changed-files.txt
          echo "Changed files: $(wc -l < changed-files.txt)"

      - name: Classify the change (voice-path or not)
        id: scope
        run: |
          set -euo pipefail
          if [ -f changed-files.txt ]; then
            python3 scripts/maintenance/voice_gate_check.py \
              --scope-only --changed-files-from changed-files.txt
          else
            # merge_group / workflow_dispatch: no PR file list available. The
            # checker treats a missing list as UNKNOWN -> gate required.
            python3 scripts/maintenance/voice_gate_check.py --scope-only
          fi

  # ------------------------------------------------------------- evidence ----
  # Self-hosted, and ONLY for voice-path PRs. Asserts the same artifact contract
  # the deploy path asserts — plus the revision binding, which the deploy path
  # does not need and the PR path cannot do without: a fresh passing artifact from
  # `main` would otherwise clear every voice PR for the whole freshness window.
  #
  # FORK GATING: a fork PR reaches this job only when a maintainer applies the
  # `voice-gate-approved` label. Without that it stays skipped, and the summary
  # job below then FAILS the PR (fail-closed) with instructions. Same-repo PRs —
  # how this repo actually works — are unaffected. An `environment:` with required
  # reviewers can be layered on top for a second, GitHub-enforced approval; it is
  # deliberately not wired here because a missing environment blocks every PR.
  replay-evidence:
    needs: scope
    if: >-
      needs.scope.outputs.voice == 'true' &&
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       contains(github.event.pull_request.labels.*.name, 'voice-gate-approved'))
    runs-on: self-hosted
    permissions:
      # READ-ONLY, deliberately. This job runs on the Jetson; it reads one JSON
      # file and needs nothing else. It must never hold `checks: write` — the job
      # closest to the production box is the last one that should be able to
      # satisfy the merge gate.
      contents: read
    # Bounds a hung read. Note this does NOT bound QUEUE time: if the Jetson
    # runner is offline this job waits, `voice-gate` waits with it, and the PR is
    # blocked. That is the fail-closed direction, and the break-glass label
    # (.github/workflows/break-glass.yml) is the documented recovery.
    timeout-minutes: 10
    steps:
      - name: Check out the BASE commit (trusted code only)
        uses: actions/checkout@v4
        with:
          # THE load-bearing line for the self-hosted runner. Checking out the PR
          # head here would execute attacker-controlled code on the box that runs
          # the live voice brain.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert a fresh passing replay-gate result BOUND to this PR head
        env:
          # The PR head enters as a 40-hex string and is only ever COMPARED
          # against the sha the probe recorded. The checker validates its shape
          # and refuses anything else.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILES: ${{ needs.scope.outputs.files }}
        run: |
          set -euo pipefail
          echo "Voice-path files in this PR: ${FILES}"
          echo "Requiring replay-gate evidence bound to ${HEAD_SHA}"
          # --require: scope already decided this PR needs the gate.
          # --expect-revision: the artifact must record having exercised THIS
          # commit. Freshness alone is not evidence for this PR's code.
          python3 scripts/maintenance/voice_gate_check.py \
            --require --expect-revision "${HEAD_SHA}"

  # ----------------------------------------------------------- the verdict ----
  # PUBLISHES THE REQUIRED CONTEXT. `if: always()` plus `needs` on both jobs is
  # what guarantees a conclusion on every PR, including ones where
  # `replay-evidence` was skipped.
  #
  # The context is published by NAME (`voice-gate`) against the PR HEAD sha rather
  # than inferred from this job's name — a `pull_request_target` run is associated
  # with the BASE commit, so a job named `voice-gate` would report on the wrong
  # SHA and the PR would block forever. Keep the published name in sync with
  # branch protection's required contexts.
  verdict:
    needs: [scope, replay-evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The ONLY grant of checks:write in this workflow — publishing the required
      # `voice-gate` context against the PR head.
      checks: write
      # Both reads are demonstrably needed by the competing-producer guard below:
      # the changed-file list, and the content of any changed workflow file.
      contents: read
      pull-requests: read
    steps:
      - name: Decide and publish the voice-gate context
        uses: actions/github-script@v7
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VOICE: ${{ needs.scope.outputs.voice }}
          FILES: ${{ needs.scope.outputs.files }}
          EVIDENCE_RESULT: ${{ needs.replay-evidence.result }}
        with:
          script: |
            const CONTEXT = 'voice-gate';
            const pr = context.payload.pull_request;
            if (!pr) { core.info('no pull request in this event — nothing to publish'); return; }

            const scopeResult = process.env.SCOPE_RESULT;
            const voice = process.env.VOICE;
            const files = process.env.FILES || '(none)';
            const evidence = process.env.EVIDENCE_RESULT;
            const headSha = pr.head.sha;
            const isFork = pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            core.info(`scope=${scopeResult} voice=${voice} evidence=${evidence} fork=${isFork}`);

            // ---- COMPETING-PRODUCER GUARD --------------------------------------
            // Branch protection matches a required context BY NAME. It cannot
            // authenticate the producer, so ANY workflow that publishes a check run
            // named `voice-gate` satisfies the gate — and GitHub publishes a check
            // run for every job automatically, no `checks: write` needed. A PR that
            // adds `.github/workflows/anything.yml` with a job called `voice-gate`
            // therefore publishes its own passing gate, PRE-merge, on its own head.
            //
            // This guard lives in the base-owned pull_request_target workflow, so
            // the PR cannot disable it: editing this file has no effect on its own
            // run. It reads the PR's workflow files as DATA (never executes them)
            // and fails the verdict if any file other than the sanctioned one looks
            // like a `voice-gate` producer.
            //
            // Deliberately NOT extended to `validate` / `secret-scan`: those are
            // legitimately defined as jobs in validate.yml, and flagging every PR
            // that edits CI would be noise with no override. Their PR-editability
            // is a separate, documented residual (see merge-and-deploy.md).
            const SANCTIONED = '.github/workflows/voice-gate.yml';
            const findCompetingProducers = async () => {
              const changed = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100,
              });
              const suspects = changed.filter(f =>
                f.filename.startsWith('.github/workflows/') &&
                f.status !== 'removed' &&
                f.filename !== SANCTIONED);
              const hits = [];
              for (const f of suspects) {
                let text;
                try {
                  const res = await github.rest.repos.getContent({
                    owner: context.repo.owner, repo: context.repo.repo,
                    path: f.filename, ref: headSha,
                  });
                  text = Buffer.from(res.data.content, 'base64').toString('utf8');
                } catch (e) {
                  // Unreadable is not evidence of innocence.
                  hits.push(`${f.filename} (could not be read: ${e.message})`);
                  continue;
                }
                // Targeted signals, not a bare substring match — a comment
                // mentioning voice-gate in another workflow is legitimate and must
                // not block the PR. These are the three ways a file can actually
                // publish the context: a job id, a job/check `name:` override, or
                // an explicit Checks API call.
                const asJobId = /^\s{2}["']?voice-gate["']?\s*:/m.test(text);
                const asName = /^\s*name:\s*["']?voice-gate["']?\s*$/m.test(text);
                const viaApi = /checks\.create|\/check-runs/.test(text) &&
                               /voice-gate/.test(text);
                const why = [asJobId && 'job id', asName && '`name:` override',
                             viaApi && 'Checks API call'].filter(Boolean);
                if (why.length) hits.push(`${f.filename} (${why.join(', ')})`);
              }
              return hits;
            };

            let competing;
            try {
              competing = await findCompetingProducers();
            } catch (e) {
              // The guard itself failing is not permission to skip it.
              competing = [`(guard could not run: ${e.message})`];
            }

            let conclusion = 'failure', title = '', summary = '';

            if (competing.length) {
              title = 'A second `voice-gate` producer was added by this PR';
              summary = `Branch protection matches a required context by NAME and cannot ` +
                `authenticate its producer, so a workflow other than \`${SANCTIONED}\` that ` +
                `publishes a \`voice-gate\` check would satisfy the merge gate on this PR's ` +
                `own head.\n\nFlagged:\n\n` +
                competing.map(h => `* \`${h}\``).join('\n') +
                `\n\nIf this is legitimate (renaming the gate, splitting the workflow), land ` +
                `it as a separate, reviewed change to \`${SANCTIONED}\` and branch protection ` +
                `together — not alongside other work. This guard runs from the base ref and ` +
                `cannot be disabled by the PR it is checking.`;
            } else if (scopeResult !== 'success') {
              // Could not classify -> fail closed. An unreadable scope job is not
              // evidence of a non-voice PR.
              title = 'Could not determine whether this PR touches the voice path';
              summary = `The scope job ended \`${scopeResult}\`, so this PR is treated as if it ` +
                `DOES touch the voice runtime path. Re-run the job. The classifier is plain ` +
                `python over an API-supplied file list and runs locally:\n\n` +
                '```\npython3 scripts/maintenance/voice_gate_check.py --scope-only --diff origin/main...HEAD\n```';
            } else if (voice !== 'true') {
              // The common case, and the reason this context is safe to require on
              // every PR: it passes trivially and never involves the Jetson.
              conclusion = 'success';
              title = 'Not applicable — no voice-runtime files changed';
              summary = 'This PR touches no voice-runtime files, so the replay gate does not apply.';
            } else if (evidence === 'success') {
              conclusion = 'success';
              title = 'Replay gate proven for this head';
              summary = `Voice-path files: \`${files}\`\n\nA fresh, passing replay-gate result ` +
                `bound to \`${headSha}\` was verified on the self-hosted runner.`;
            } else if (evidence === 'skipped' && isFork) {
              // A gated-off fork looks identical to a missing runner unless named.
              title = 'Fork PR needs maintainer approval';
              summary = `Voice-path files: \`${files}\`\n\nThe replay-gate evidence job runs on ` +
                `the self-hosted Jetson and is NOT run for forks automatically. A maintainer must ` +
                `review this diff and apply the \`voice-gate-approved\` label.`;
            } else {
              title = 'Replay-gate evidence missing for this head';
              summary = `Voice-path files: \`${files}\`\n\nEvidence job: \`${evidence}\`.\n\n` +
                `The evidence must be BOUND to this head (\`${headSha}\`). On the Jetson as user ` +
                `zoe:\n\n` +
                '```\n' +
                `git -C /home/zoe/assistant fetch origin ${headSha}\n` +
                `git worktree add ~/.worktrees/voice-gate ${headSha}\n` +
                'flock /tmp/zoe-voice-harness.lock \\\n' +
                '  python3 scripts/maintenance/voice_regression_probe.py \\\n' +
                '    --samples 20 --service-dir ~/.worktrees/voice-gate/services/zoe-data\n' +
                '```\n\n' +
                `An artifact for any other commit is evidence for different code and will not ` +
                `clear this PR. If the self-hosted runner is offline, see the break-glass ` +
                `procedure in docs/knowledge/merge-and-deploy.md.`;
            }

            // Publish against the PR HEAD, not this run's SHA (which is the base).
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: CONTEXT, head_sha: headSha,
              status: 'completed', conclusion,
              output: { title, summary },
            });
            core.notice(`${CONTEXT}: ${conclusion} on ${headSha} — ${title}`);
            core.summary.addHeading(`voice-gate: ${conclusion}`, 3).addRaw(summary);
            await core.summary.write();
            if (conclusion !== 'success') {
              // Fail the job too, so the run itself is visibly red. The PUBLISHED
              // context is what branch protection reads, but a green run next to a
              // red context reads as a glitch rather than a decision.
              core.setFailed(`${CONTEXT}: ${title}`);
            }
