name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # Required checks must report on the merge_group event or a merge queue stalls
  # forever waiting for them (GitHub: "checks that only run on pull_request will not
  # execute during merge queue operations"). Harmless until a queue is enabled — no
  # merge_group events are produced without one. See docs/knowledge/merge-queue-switch.md.
  merge_group:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── THE REQUIRED `validate` GATE, SHARDED (2026-11-10) ──────────────────────────────────────────────────────
  #
  # `validate` used to be ONE job that ran every lane serially: ~41 min, of which ~26 were the zoe-data
  # ci_safe lane and ~13 the tests/unit ci_safe lane. Branch protection is `strict`, so every merge sends every
  # other open PR back through it — that 41 min was the throughput ceiling of the whole repo.
  #
  # Now the work runs as parallel jobs, and `validate` is an AGGREGATOR at the bottom of this file:
  #   checks           validators, Alembic on CI PostgreSQL, actionlint, py_compile, and the small lanes
  #   zoe-data-shard   services/zoe-data/tests -m ci_safe, split ZOE_DATA_SHARDS ways (matrix)
  #   unit-shard       tests/unit -m ci_safe, split UNIT_SHARDS ways (matrix)
  #   collect          each split lane's FULL --collect-only selection, for the completeness proof
  #   validate         needs all of the above, `if: always()`, red unless every one SUCCEEDED and the shard
  #                    ledgers partition the full selection exactly (tools/ci/shard_ledger.py)
  #
  # Why process-isolated matrix shards and not pytest-xdist: each shard is ONE serial pytest process running a
  # contiguous slice of the same ordered collection the old single lane ran (pytest-split's
  # `duration_based_chunks`), so test order and per-file module state are what they always were. xdist would
  # interleave files across workers inside one runner, which these suites (module-level sys.modules swaps,
  # process env, fixed state paths) were never proven safe for.
  #
  # The REQUIRED context name `validate` must keep reporting: see tests/unit/test_required_gate_workflows.py and
  # tests/unit/test_ci_instrument_honesty.py, which pin the aggregator, its `needs`, `if: always()` and the
  # every-result-must-be-success rule. A shard count is changed in ONE place — the matrix list AND the
  # `--splits` value AND the aggregator's `--expect-shards` move together (the tests pin that they agree).
  checks:
    runs-on: ubuntu-latest
    # Healthy ~3 min; the pytest step budgets below sum to 20.
    timeout-minutes: 30

    env:
      CI_DB_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD || 'ci-postgres-pw' }}

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: zoe
          POSTGRES_USER: zoe
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD || 'ci-postgres-pw' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zoe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Install CI deps (slim list + lane deps)
        id: deps
        uses: ./.github/actions/ci-deps
        with:
          python-version: '3.10'

      - name: Validate project structure
        run: python3 tools/audit/validate_structure.py

      - name: Validate critical files
        run: python3 tools/audit/validate_critical_files.py

      - name: nginx config must parse (the real conf + snippets, throwaway cert)
        run: |
          # The conf is only ever loaded on the Jetson at deploy time; a typo there froze
          # the UI edge once already. Test it here with the exact image tag compose uses.
          # Upstream hostnames are resolved at load, so pin them to loopback for the parse.
          mkdir -p /tmp/zoe-ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=zoe" \
            -keyout /tmp/zoe-ssl/zoe.key -out /tmp/zoe-ssl/zoe.crt 2>/dev/null
          docker run --rm --add-host zoe-auth:127.0.0.1 --add-host host.docker.internal:127.0.0.1 \
            -v "$PWD/services/zoe-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/services/zoe-ui/nginx.d:/etc/nginx/zoe:ro" \
            -v /tmp/zoe-ssl:/etc/nginx/ssl:ro \
            nginx@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60 nginx -t
          # Negative control: a broken conf must fail this exact command.
          sed 's/gzip on;/gzip definitely-not-a-value;/' services/zoe-ui/nginx.conf > /tmp/broken.conf
          if docker run --rm --add-host zoe-auth:127.0.0.1 --add-host host.docker.internal:127.0.0.1 \
            -v /tmp/broken.conf:/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/services/zoe-ui/nginx.d:/etc/nginx/zoe:ro" \
            -v /tmp/zoe-ssl:/etc/nginx/ssl:ro \
            nginx@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60 nginx -t 2>/dev/null; then
            echo "::error::nginx -t accepted a deliberately broken conf — the check is not checking"; exit 1
          fi

      - name: Validate offline memory policy
        run: python3 tools/audit/validate_offline_memory.py

      - name: Run Alembic migrations on CI PostgreSQL
        id: alembic
        run: |
          cd services/zoe-data
          POSTGRES_URL=postgresql://zoe:${CI_DB_PASSWORD}@localhost:5432/zoe \
            python3 -c "
          import os
          os.environ['POSTGRES_URL'] = f'postgresql://zoe:{os.environ[\"CI_DB_PASSWORD\"]}@localhost:5432/zoe'
          from alembic.config import Config
          from alembic import command as alembic_cmd
          cfg = Config('alembic.ini')
          cfg.set_main_option('sqlalchemy.url', f'postgresql+psycopg2://zoe:{os.environ[\"CI_DB_PASSWORD\"]}@localhost:5432/zoe')
          cfg.set_main_option('script_location', 'alembic')
          alembic_cmd.upgrade(cfg, 'head')
          print('Alembic migrations OK')
          "
        env:
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe

      # actionlint validates workflow files against GitHub's ACTUAL schema. PyYAML
      # passing is not evidence a workflow parses: greptile-gate.yml carried an
      # invalid `on:` event (`pull_request_review_thread`) through ten review rounds
      # and 15 commits — GitHub failed the file at parse time on EVERY push, the
      # workflow never executed once, and nothing in CI noticed. A zero-job parse
      # failure does not even fail a required check, so this is the only gate.
      - name: Workflow lint (actionlint — a workflow that cannot parse cannot gate)
        run: |
          # Pinned sha256 from the release's checksums.txt — verify BEFORE anything
          # executes or extracts, so neither a compromised nor a truncated artifact
          # gets run (Copilot flagged the unverified curl|tar).
          curl -sSfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz actionlint
          # -shellcheck= (empty) disables the embedded-shell lint: deploy.yml has
          # pre-existing SC2155 warnings that are style, not parse failures. This
          # step exists to catch workflows GitHub itself cannot parse — keep it
          # sharp for that and let shell style stay out of the merge gate.
          ./actionlint -color -shellcheck=
          # NEGATIVE CONTROL, every run: prove the gate can still go red. Feed it a
          # workflow with exactly the defect class it exists to catch (an invalid
          # `on:` event) and require a non-zero exit. If actionlint is ever
          # misconfigured into a yes-machine, this fails the lane instead of the
          # lane silently guarding nothing — a lint that cannot fail is not a gate.
          cat > /tmp/known-bad-workflow.yml <<'BAD'
          name: negative-control
          on:
            pull_request_review_thread:
              types: [resolved]
          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: "true"
          BAD
          if ./actionlint -shellcheck= /tmp/known-bad-workflow.yml; then
            echo "::error::actionlint PASSED a known-invalid workflow — the gate is not gating"
            exit 1
          fi
          echo "negative control OK: actionlint rejects the known-bad fixture"
          rm -f actionlint /tmp/known-bad-workflow.yml

      - name: Python syntax check (all zoe-data modules)
        run: |
          find services/zoe-data -name "*.py" \
            -not -path "*/__pycache__/*" \
            -not -path "*/.pytest_cache/*" \
            | sort | xargs python3 -m py_compile
          echo "All Python files: syntax OK"

      # Heavy tests requiring Jetson-specific packages (whisper, torch, MemPalace)
      # still run on the Jetson or during focused local validation.
      #
      # EVERY LANE RUNS EVEN IF AN EARLIER ONE FAILED (2026-10-19, deep dive 2 lane K / T-2): separate steps,
      # each gated on `!cancelled()` + the dependency install (not on its sibling lanes), and `--maxfail=200`
      # instead of `-x`. The required `validate` aggregator is red if ANY job here is red.
      # tests/unit/test_ci_instrument_honesty.py pins all of this.
      - name: Lane — Home Assistant MCP bridge
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          pytest \
            -o faulthandler_timeout=240 \
            services/homeassistant-mcp-bridge/tests/test_ha_bridge.py \
            services/homeassistant-mcp-bridge/tests/test_ha_tool_names.py \
            --maxfail=200 -q \
            --override-ini="asyncio_mode=auto"
        env:
          PYTHONPATH: ${{ github.workspace }}/services/zoe-data
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"

      # Full zoe-auth suite — no hand enumeration (the old 4-file list
      # silently dropped test_oidc_login / test_rbac / test_security).
      - name: Lane — zoe-auth (full)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          PYTHONPATH="${{ github.workspace }}/services/zoe-auth:${{ github.workspace }}/services/zoe-auth/tests" pytest \
            -o faulthandler_timeout=240 \
            services/zoe-auth/tests \
            --maxfail=200 -q
        env:
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"

      - name: People MemPalace integration cleanup
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          PYTHONPATH="${{ github.workspace }}/services/zoe-data" pytest \
            -o faulthandler_timeout=240 \
            tests/integration/test_people_mempalace_sync.py \
            -q \
            --override-ini="asyncio_mode=auto"
        env:
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe

      # The people graph's invariants (advisory locks, transactional supersede + rollback, the 0043 timestamp trigger
      # and indexes) only exist on REAL PostgreSQL. The file is deliberately NOT ci_safe (the slim lane has no
      # database), so the marker lanes never select it: this step runs it by path against the service container
      # the Alembic step just migrated to head. ZOE_REQUIRE_PG_TESTS turns a missing database / driver into a FAILURE
      # here instead of a silent skip. It still skips cleanly everywhere else (no URL -> skipped).
      - name: People graph invariants on CI PostgreSQL
        if: ${{ !cancelled() && steps.alembic.outcome == 'success' && steps.deps.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          pip install --quiet asyncpg
          PYTHONPATH="${{ github.workspace }}/services/zoe-data" pytest \
            -o faulthandler_timeout=240 \
            services/zoe-data/tests/test_people_graph_postgres.py \
            -q -rs \
            --override-ini="asyncio_mode=auto"
        env:
          ZOE_TEST_PG_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe
          ZOE_REQUIRE_PG_TESTS: "1"

  # zoe-data slim-dep-green tests are selected by the `ci_safe` marker (registered in pytest.ini), not a
  # hand-enumerated file list — a new slim-safe test runs here just by adding a co-located
  # `pytestmark = pytest.mark.ci_safe` line, no YAML edit, and pytest-split assigns it to a shard at
  # collection time (no per-shard file list exists anywhere). The full dir runs on the Jetson
  # (self-hosted-tests.yml) as the catch-all safety net, so an UNMARKED new test still runs somewhere.
  #
  # NO Postgres service: the ci_safe zoe-data lane is database-free by contract (tests/AGENTS.md), and the
  # zoe-data-py312 job has run the identical lane without one since 2026-10-19 with identical counts.
  #
  # `duration_based_chunks` with no stored durations = equal-COUNT contiguous slices of the ordered selection.
  # It is positional, so it is stable even though a few tests mint random parametrize ids per process.
  zoe-data-shard:
    name: zoe-data ci_safe (${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      - name: Install CI deps (slim list + lane deps)
        id: deps
        uses: ./.github/actions/ci-deps
        with:
          python-version: '3.10'

      - name: Lane — zoe-data (ci_safe) shard
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          pytest services/zoe-data/tests -m ci_safe \
            -o faulthandler_timeout=300 \
            --ignore=services/zoe-data/tests/samantha_live \
            --maxfail=200 -q \
            --override-ini="asyncio_mode=auto" \
            -p pytest_shard_ledger \
            --splits 4 --group ${{ matrix.group }} --splitting-algorithm duration_based_chunks \
            --store-durations --durations-path "${{ runner.temp }}/ledger/durations-zoe-data-${{ matrix.group }}.json" \
            --durations=50 --durations-min=1.0
        env:
          PYTHONPATH: ${{ github.workspace }}/services/zoe-data:${{ github.workspace }}/tools/ci
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"
          # Household-data canary key (tests/unit/test_privacy_canary.py; tools/audit/privacy_canary.py). An
          # owner-provisioned repository secret; unset = that one scan reports a skip, the mechanism tests still run.
          ZOE_PRIVACY_CANARY_KEY: ${{ secrets.ZOE_PRIVACY_CANARY_KEY }}
          PYTEST_SHARD_LEDGER: ${{ runner.temp }}/ledger/zoe-data-${{ matrix.group }}.json

      - name: Upload shard ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shard-ledger-zoe-data-${{ matrix.group }}
          path: ${{ runner.temp }}/ledger/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  # Repo-root tests/unit uses the SAME marker lane as zoe-data (no hand-enumerated file list — that list
  # silently dropped every other tests/unit file out of CI). Unmarked files run in the full-dir tests/unit
  # catch-all on the Jetson (self-hosted-tests.yml). Keeps a Postgres service + POSTGRES_URL, as the lane always had.
  unit-shard:
    name: tests/unit ci_safe (${{ matrix.group }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]

    # A Postgres service because a few ci_safe tests/unit tests open a pool against POSTGRES_URL in CI
    # (test_mcp_server's stdio server). Trust auth on the throwaway loopback container, so this job carries NO
    # password literal: the `checks` job keeps the one CI password fallback the repo has always had.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: zoe
          POSTGRES_USER: zoe
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zoe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Install CI deps (slim list + lane deps)
        id: deps
        uses: ./.github/actions/ci-deps
        with:
          python-version: '3.10'

      - name: Lane — tests/unit (ci_safe) shard
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/services/zoe-data:${{ github.workspace }}/tools/ci" pytest \
            -o faulthandler_timeout=300 \
            tests/unit -m ci_safe \
            --maxfail=200 -q \
            --override-ini="asyncio_mode=auto" \
            -p pytest_shard_ledger \
            --splits 2 --group ${{ matrix.group }} --splitting-algorithm duration_based_chunks \
            --store-durations --durations-path "${{ runner.temp }}/ledger/durations-unit-${{ matrix.group }}.json" \
            --durations=50 --durations-min=1.0
        env:
          POSTGRES_URL: postgresql://zoe@localhost:5432/zoe
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"
          PYTEST_SHARD_LEDGER: ${{ runner.temp }}/ledger/unit-${{ matrix.group }}.json

      - name: Upload shard ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shard-ledger-unit-${{ matrix.group }}
          path: ${{ runner.temp }}/ledger/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  # The completeness proof's reference: each split lane's FULL selection, collected (not run) in a fresh
  # process with the same deps, PYTHONPATH and env as its shards. `validate` checks the shards against it.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install CI deps (slim list + lane deps)
        id: deps
        uses: ./.github/actions/ci-deps
        with:
          python-version: '3.10'

      - name: Collect — zoe-data (ci_safe), full selection
        timeout-minutes: 5
        run: |
          set -o pipefail
          pytest services/zoe-data/tests -m ci_safe \
            --ignore=services/zoe-data/tests/samantha_live \
            -q --collect-only \
            --override-ini="asyncio_mode=auto" \
            -p pytest_shard_ledger | tail -n 3
        env:
          PYTHONPATH: ${{ github.workspace }}/services/zoe-data:${{ github.workspace }}/tools/ci
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"
          ZOE_PRIVACY_CANARY_KEY: ${{ secrets.ZOE_PRIVACY_CANARY_KEY }}
          PYTEST_SHARD_LEDGER: ${{ runner.temp }}/ledger/full-zoe-data.json

      - name: Collect — tests/unit (ci_safe), full selection
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/services/zoe-data:${{ github.workspace }}/tools/ci" pytest \
            tests/unit -m ci_safe \
            -q --collect-only \
            --override-ini="asyncio_mode=auto" \
            -p pytest_shard_ledger | tail -n 3
        env:
          # The unit shards' exact URL (set, so any collection-time branch on it matches); nothing is listening
          # here and collection never connects.
          POSTGRES_URL: postgresql://zoe@localhost:5432/zoe
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"
          PYTEST_SHARD_LEDGER: ${{ runner.temp }}/ledger/full-unit.json

      - name: Upload full-selection ledgers
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shard-ledger-full
          path: ${{ runner.temp }}/ledger/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  # THE REQUIRED CONTEXT. An aggregator, not a lane: it does no testing itself, it decides.
  #
  # `if: always()` is load-bearing — without it a failed or cancelled shard SKIPS this job, and a skipped job
  # publishes no failing `validate`... the required context would then never report (GitHub waits forever) or,
  # worse, report `skipped`, which branch protection treats as passing. With `always()` it ALWAYS runs and
  # concludes, and it concludes success ONLY when every needed job's result is exactly `success` — `failure`,
  # `cancelled` and `skipped` are all red here. Then it proves the shards ran every collected test exactly once.
  validate:
    needs: [checks, zoe-data-shard, unit-shard, collect]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci

      - name: Download shard ledgers
        uses: actions/download-artifact@v8
        with:
          pattern: shard-ledger-*
          path: ledgers
          merge-multiple: true

      - name: Every collected test ran in exactly one shard
        if: ${{ !cancelled() }}
        run: |
          ls -l ledgers || true
          rc=0
          python3 tools/ci/shard_ledger.py verify --lane zoe-data --full ledgers/full-zoe-data.json \
            --expect-shards 4 ledgers/zoe-data-*.json || rc=1
          python3 tools/ci/shard_ledger.py verify --lane tests/unit --full ledgers/full-unit.json \
            --expect-shards 2 ledgers/unit-*.json || rc=1
          exit "$rc"

      - name: Every needed job must have SUCCEEDED (skipped / cancelled / failed = red)
        if: ${{ always() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {"checks", "zoe-data-shard", "unit-shard", "collect"}
          bad = {job: (needs.get(job) or {}).get("result") for job in sorted(expected)}
          bad = {job: result for job, result in bad.items() if result != "success"}
          if set(needs) != expected:
              print(f"::error::needs drifted from the expected set: {sorted(needs)} != {sorted(expected)}")
              sys.exit(1)
          for job, result in bad.items():
              print(f"::error::{job} concluded {result!r}, not 'success' — the required gate is red")
          if bad:
              sys.exit(1)
          print("all needed jobs succeeded:", ", ".join(sorted(expected)))
          PY

  # The zoe-data ci_safe lane on PYTHON 3.12 — the interpreter the LIVE service runs.
  #
  # The required gate runs 3.10 (the rollback-only interpreter the Jetson's system python still is).
  # Production zoe-data has run the B0.7 3.12 venv since the cutover, so a 3.12-only break (a removed stdlib
  # module, a changed asyncio default, a typing change) would have been green in the required gate and red on
  # the box. 2026-10-19 deep dive 2 lane K / T-2.
  #
  # A SEPARATE, NOT branch-protected job: it reports a visible check on every PR, heeded when red, promoted to
  # required only after it has shown itself stable (the same path `deps-resolvable` is on). Adding a required
  # context is a branch-protection change, which is the owner's.
  #
  # Deliberately NOT sharded (2026-11-10): it is informational, so its ~25 min never holds a merge, and four more
  # runners per PR would push concurrent PRs past the account's parallel-job limit and queue the REQUIRED shards.
  #
  # Same deps action and lane command as the zoe-data shards minus the split (tests/unit/test_ci_instrument_honesty.py
  # asserts it). NO Postgres service and no migrations: the ci_safe zoe-data lane is database-free by contract.
  zoe-data-py312:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v7

      - name: Install CI deps (slim list + lane deps)
        id: deps
        uses: ./.github/actions/ci-deps
        with:
          python-version: '3.12'

      - name: Lane — zoe-data (ci_safe) on Python 3.12
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          python3 --version
          pytest services/zoe-data/tests -m ci_safe \
            -o faulthandler_timeout=300 \
            --ignore=services/zoe-data/tests/samantha_live \
            --maxfail=200 -q \
            --override-ini="asyncio_mode=auto" \
            --durations=50 --durations-min=1.0
        env:
          PYTHONPATH: ${{ github.workspace }}/services/zoe-data
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"
          # Same env as the required shards minus the shard plumbing (tests/unit/test_ci_instrument_honesty.py pins it).
          ZOE_PRIVACY_CANARY_KEY: ${{ secrets.ZOE_PRIVACY_CANARY_KEY }}

  # Are the dependency manifests still SATISFIABLE, and do their load-bearing
  # ceilings still hold?
  #
  # Nothing else checks this. The `validate` job installs a hand-written slim list,
  # never the manifests themselves, so a requirements.txt could become
  # unresolvable — or quietly resolve past `numpy<2` — and every check would stay
  # green until a deploy tried to install it on the Jetson.
  #
  # This resolves with `--dry-run` (metadata only, nothing is installed or built
  # into an environment) and then asserts the ceilings that exist for data-safety
  # rather than taste. `numpy<2` is the one that matters most: several packages
  # declare a bare unbounded `numpy`, so without that ceiling an install pulls
  # NumPy 2.x, which is a C-ABI break for every compiled package on this box
  # (both canonical voice rocks).
  #
  # NOT branch-protected on purpose — it resolves against live PyPI, so an
  # upstream yank or outage could redden it, and a required check that depends on
  # a third party is how `main` freezes. Read it; promote it to required only once
  # it has shown itself stable.
  deps-resolvable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # MUST match the Jetson's interpreter — resolvability is
          # Python-version-specific. websockets 17 and av 18 install fine on 3.11
          # and not at all on 3.10, so resolving on the wrong version would bless
          # a manifest the box cannot install.
          python-version: '3.10'

      # `packaging` is vendored INSIDE pip, not importable as a top-level module on
      # a bare runner — the assertion script below needs it as a real import. A dev
      # box usually has it already, which is exactly why this has to be explicit.
      - name: Install the guard's own dependency
        run: python3 -m pip install --quiet packaging

      - name: Resolve every requirements manifest
        run: |
          set -euo pipefail
          FILES="
            services/zoe-data/requirements.txt
            services/zoe-auth/requirements.txt
            services/homeassistant-mcp-bridge/requirements.txt
            labs/setfit-router/requirements.txt
          "
          for f in $FILES; do
            echo "::group::pip resolve $f"
            python3 -m pip install --dry-run --ignore-installed --quiet \
              --report "report.json" -r "$f"
            python3 - "$f" <<'PY'
          import json, sys
          from packaging.version import Version

          path = sys.argv[1]
          with open("report.json") as fh:
              report = json.load(fh)
          pkgs = {
              item["metadata"]["name"].lower().replace("_", "-"): item["metadata"]["version"]
              for item in report["install"]
          }
          print(f"{path}: resolved {len(pkgs)} packages")

          # Ceilings that protect DATA or a canonical rock, not preference.
          # Scoped PER FILE on purpose: zoe-data pulls bcrypt transitively through
          # `passlib[bcrypt]` and lets it float to 5.x, which is harmless there
          # (nothing in zoe-data hashes a password). The <5.0 ceiling is a zoe-auth
          # constraint, so asserting it repo-wide would fail on an unrelated
          # manifest and teach everyone to ignore this job.
          CEILINGS_BY_FILE = {
              "services/zoe-data/requirements.txt": {
                  "numpy": "2.0",     # C-ABI break for every compiled pkg on the Jetson
              },
              "services/zoe-auth/requirements.txt": {
                  "bcrypt": "5.0",    # 5.0 turns >72-byte passwords into a ValueError
              },
              "labs/setfit-router/requirements.txt": {
                  "numpy": "2.0",     # must match the versions the router head was trained with
              },
          }
          ceilings = CEILINGS_BY_FILE.get(path, {})
          if not ceilings:
              print("  (no ceilings declared for this manifest — resolvability only)")
          failed = False
          for name, ceiling in ceilings.items():
              got = pkgs.get(name)
              if got is None:
                  continue
              if Version(got) >= Version(ceiling):
                  print(f"::error::{path}: {name}=={got} breaches the <{ceiling} ceiling")
                  failed = True
              else:
                  print(f"  ok: {name}=={got} < {ceiling}")
          sys.exit(1 if failed else 0)
          PY
            rm -f report.json
            echo "::endgroup::"
          done

      - name: Resolve the zoe-data Python 3.12 venv manifest (cp312 / aarch64)
        # requirements-py312.txt is the INSTALLER of the B0.7 venv, so it must
        # resolve for the TARGET — CPython 3.12 on aarch64-manylinux_2_31 (the Orin's
        # glibc 2.35) — which the pip loop above (runner's 3.10 / x86_64) cannot
        # express. The build script's --dry-run is the exact resolve an operator
        # runs, so the check is single-sourced there (it also reads the torch wheel
        # URL's metadata, so a dead URL fails here). uv is pinned to the version the
        # manifest was measured with; resolution only, nothing is installed.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "uv==0.10.11"
          scripts/setup/build_py312_venv.sh --dry-run
          # negative control: the same uv resolve must reject a contradiction
          printf 'numpy<2\nnumpy>=2.1\n' > /tmp/known-bad-py312.txt
          # -o a real file: uv writes via a temp file beside its output, so -o /dev/null
          # fails with "Permission denied" — which would satisfy this control vacuously.
          # Require the RESOLVER's refusal, by message, not just any non-zero exit.
          if uv pip compile /tmp/known-bad-py312.txt --python-version 3.12 \
               --python-platform aarch64-manylinux_2_31 --quiet -o /tmp/known-bad-py312.out \
               2>/tmp/known-bad-py312.err; then
            echo "::error::uv RESOLVED a contradictory manifest — the py312 resolve is not guarding"
            exit 1
          fi
          grep -q "unsatisfiable" /tmp/known-bad-py312.err || {
            cat /tmp/known-bad-py312.err
            echo "::error::uv failed for a reason other than unsatisfiability — the control proved nothing"
            exit 1
          }
          echo "negative control OK: uv rejects the known-unsatisfiable fixture"

      - name: Negative control — the guard must still be able to fail
        # A resolver check that cannot go red is not a check. Feed pip a genuinely
        # unsatisfiable pair and require a non-zero exit, every run. Same rule the
        # actionlint step follows above.
        run: |
          set -euo pipefail
          printf 'numpy<2\nnumpy>=2.1\n' > /tmp/known-bad-requirements.txt
          if python3 -m pip install --dry-run --ignore-installed --quiet \
               -r /tmp/known-bad-requirements.txt; then
            echo "::error::pip RESOLVED a contradictory manifest — this guard is not guarding"
            exit 1
          fi
          echo "negative control OK: pip rejects the known-unsatisfiable fixture"
          rm -f /tmp/known-bad-requirements.txt

  # Secret scanning as a MERGE-QUEUE-COMPATIBLE gate.
  #
  # The GitGuardian GitHub App cannot report on `merge_group`, so it can never be a
  # required check once a merge queue is enabled (GitHub: checks that only run on
  # pull_request will not execute during merge queue operations). This job is the
  # Action equivalent and inherits this workflow's merge_group trigger, so it CAN.
  # The App stays installed for its dashboard alerts and PR comments — only the
  # blocking gate moves here. See docs/knowledge/merge-queue-switch.md.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # ggshield scans BRANCH HISTORY, not just the head tree: a credential in an
          # intermediate commit fails even when the final diff is clean. Full history
          # is required or the scan silently checks far less than it appears to.
          fetch-depth: 0

      - name: Skip on fork PRs (the secret is not available there)
        id: forkcheck
        # A fork PR cannot read repository secrets, so the explicit missing-key check
        # below would fail EVERY external contribution. The GitGuardian App still scans
        # fork PRs, so coverage is not lost — this only moves which gate reports.
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::notice::Fork PR — ggshield skipped (no secret access). The GitGuardian App still scans this PR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly if the scan gate is not actually configured
        if: steps.forkcheck.outputs.skip != 'true'
        # A missing or expired token must NOT look like a pass. This is the same rule
        # as the voice gate: an absent result is never a green one.
        run: |
          if [ -z "${{ secrets.GITGUARDIAN_API_KEY }}" ]; then
            echo "::error::GITGUARDIAN_API_KEY is not set — the secret-scan gate is NOT running."
            echo "Set it at Settings → Secrets and variables → Actions. Until then this check is meaningless."
            exit 1
          fi

      - name: GitGuardian scan
        if: steps.forkcheck.outputs.skip != 'true'
        uses: GitGuardian/ggshield-action@v1.55.0
        env:
          # `github.event.before` is all-zeros on a branch's first push and absent on
          # pull_request events — an invalid base makes ggshield scan the wrong range.
          # Blank it in that case so the action falls back to its own default.
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          # pull_request.base.sha is EMPTY on merge-queue runs. Without a base, ggshield
          # has nothing to diff against and would scan far less than it appears to — the
          # same silent-underscan failure as a shallow checkout. Fall back to the merge
          # group's base so the job stays meaningful under a queue.
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
