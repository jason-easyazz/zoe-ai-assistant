name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # Required checks must report on the merge_group event or a merge queue stalls
  # forever waiting for them (GitHub: "checks that only run on pull_request will not
  # execute during merge queue operations"). Harmless until a queue is enabled — no
  # merge_group events are produced without one. See docs/knowledge/merge-queue-switch.md.
  merge_group:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      CI_DB_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD || 'ci-postgres-pw' }}

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: zoe
          POSTGRES_USER: zoe
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD || 'ci-postgres-pw' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zoe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Slim install — avoids Jetson-specific packages (torch/onnx/whisper stacks)
      # that would timeout or fail on x86_64 GitHub runners.
      #
      # KEEP THE PINNED ENTRIES IN LOCKSTEP WITH services/zoe-data/requirements.txt.
      # Anything left unpinned here resolves to the newest release at CI time, so
      # the lane silently tests a DIFFERENT version than production runs — which is
      # exactly how uvicorn/websockets drifted (CI was exercising uvicorn 0.5x and
      # websockets 16.x while the manifest pinned 0.32.0 and 14.0). The
      # `deps-resolvable` job below proves the manifests themselves still resolve;
      # this list only has to agree with them.
      - name: Install slim CI deps
        run: |
          pip install --quiet \
            aiosqlite asyncpg psycopg2-binary alembic \
            fastapi "httpx>=0.27.0,<0.28" "apscheduler==3.10.4" "tzlocal>=2,<3" "sqlalchemy>=2.0,<3.0" \
            pydantic pywebpush py-vapid cryptography \
            "ag-ui-protocol==0.1.19" "websockets==16.1.1" python-jose passlib \
            python-multipart "uvicorn[standard]==0.49.0" prometheus-client "python-json-logger>=4.1.0" \
            pyyaml

      - name: Validate project structure
        run: python3 tools/audit/validate_structure.py

      - name: Validate critical files
        run: python3 tools/audit/validate_critical_files.py

      - name: Validate offline memory policy
        run: python3 tools/audit/validate_offline_memory.py

      - name: Run Alembic migrations on CI PostgreSQL
        run: |
          cd services/zoe-data
          POSTGRES_URL=postgresql://zoe:${CI_DB_PASSWORD}@localhost:5432/zoe \
            python3 -c "
          import os
          os.environ['POSTGRES_URL'] = f'postgresql://zoe:{os.environ[\"CI_DB_PASSWORD\"]}@localhost:5432/zoe'
          from alembic.config import Config
          from alembic import command as alembic_cmd
          cfg = Config('alembic.ini')
          cfg.set_main_option('sqlalchemy.url', f'postgresql+psycopg2://zoe:{os.environ[\"CI_DB_PASSWORD\"]}@localhost:5432/zoe')
          cfg.set_main_option('script_location', 'alembic')
          alembic_cmd.upgrade(cfg, 'head')
          print('Alembic migrations OK')
          "
        env:
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe

      # actionlint validates workflow files against GitHub's ACTUAL schema. PyYAML
      # passing is not evidence a workflow parses: greptile-gate.yml carried an
      # invalid `on:` event (`pull_request_review_thread`) through ten review rounds
      # and 15 commits — GitHub failed the file at parse time on EVERY push, the
      # workflow never executed once, and nothing in CI noticed. A zero-job parse
      # failure does not even fail a required check, so this is the only gate.
      - name: Workflow lint (actionlint — a workflow that cannot parse cannot gate)
        run: |
          # Pinned sha256 from the release's checksums.txt — verify BEFORE anything
          # executes or extracts, so neither a compromised nor a truncated artifact
          # gets run (Copilot flagged the unverified curl|tar).
          curl -sSfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz actionlint
          # -shellcheck= (empty) disables the embedded-shell lint: deploy.yml has
          # pre-existing SC2155 warnings that are style, not parse failures. This
          # step exists to catch workflows GitHub itself cannot parse — keep it
          # sharp for that and let shell style stay out of the merge gate.
          ./actionlint -color -shellcheck=
          # NEGATIVE CONTROL, every run: prove the gate can still go red. Feed it a
          # workflow with exactly the defect class it exists to catch (an invalid
          # `on:` event) and require a non-zero exit. If actionlint is ever
          # misconfigured into a yes-machine, this fails the lane instead of the
          # lane silently guarding nothing — a lint that cannot fail is not a gate.
          cat > /tmp/known-bad-workflow.yml <<'BAD'
          name: negative-control
          on:
            pull_request_review_thread:
              types: [resolved]
          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: "true"
          BAD
          if ./actionlint -shellcheck= /tmp/known-bad-workflow.yml; then
            echo "::error::actionlint PASSED a known-invalid workflow — the gate is not gating"
            exit 1
          fi
          echo "negative control OK: actionlint rejects the known-bad fixture"
          rm -f actionlint /tmp/known-bad-workflow.yml

      - name: Python syntax check (all zoe-data modules)
        run: |
          find services/zoe-data -name "*.py" \
            -not -path "*/__pycache__/*" \
            -not -path "*/.pytest_cache/*" \
            | sort | xargs python3 -m py_compile
          echo "All Python files: syntax OK"

      # Run pure unit tests plus zoe-auth contract tests that use lightweight DB fakes.
      # Heavy tests requiring Jetson-specific packages (whisper, torch, MemPalace)
      # still run on the Jetson or during focused local validation.
      - name: Unit tests (pure logic and auth contracts)
        run: |
          pip install --quiet -r services/zoe-auth/requirements.txt
          # numpy: lets the ci_safe semantic_router/router-head tests actually run
          # in this slim lane (they fake the embedding model + head; no fastembed
          # or sklearn needed). Without it they importorskip -> silently skip.
          pip install --quiet "numpy<2"
          # zoe-data slim-dep-green tests are selected by the `ci_safe` marker
          # (registered in pytest.ini), not a hand-enumerated file list — so a new
          # slim-safe test runs here just by adding a co-located
          # `pytestmark = pytest.mark.ci_safe` line, no YAML edit. The full dir runs
          # on the Jetson (self-hosted-tests.yml) as the catch-all safety net, so an
          # UNMARKED new test still runs somewhere. See tests/AGENTS.md.
          # The cross-test isolation leak that used to force --deselect exclusions
          # here is FIXED: test_auth_unauthenticated (bisected as the necessary
          # poison) swapped in a new `auth` module object without restoring the
          # original, so later dependency_overrides keyed by the new object never
          # matched → guest verdicts → 403s. Its fixture now restores the saved
          # module IDENTITY (test_metrics_auth_regression got the same fix).
          pytest services/zoe-data/tests -m ci_safe \
            --ignore=services/zoe-data/tests/samantha_live \
            -x -q \
            --override-ini="asyncio_mode=auto"
          pytest \
            services/homeassistant-mcp-bridge/tests/test_ha_bridge.py \
            -x -q \
            --override-ini="asyncio_mode=auto"
          # Repo-root tests/unit uses the SAME marker lane as zoe-data (no
          # hand-enumerated file list — that list silently dropped every other
          # tests/unit file out of CI). Slim-dep-green files opt in with a
          # co-located `pytestmark = pytest.mark.ci_safe`; unmarked files
          # (live-service smokes, PyJWT/yaml-dependent) run in the full-dir
          # tests/unit catch-all on the Jetson (self-hosted-tests.yml).
          # test_remediate_ownerless_memories.py + test_memory_service_fixes.py
          # (the two formerly enumerated here) are ci_safe-marked, so they
          # still run in this lane. See tests/AGENTS.md.
          PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/services/zoe-data" pytest \
            tests/unit -m ci_safe \
            -x -q \
            --override-ini="asyncio_mode=auto"
          # Full zoe-auth suite — no hand enumeration (the old 4-file list
          # silently dropped test_oidc_login / test_rbac / test_security).
          PYTHONPATH="${{ github.workspace }}/services/zoe-auth:${{ github.workspace }}/services/zoe-auth/tests" pytest \
            services/zoe-auth/tests \
            -x -q
        env:
          PYTHONPATH: ${{ github.workspace }}/services/zoe-data
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"

      - name: People MemPalace integration cleanup
        run: |
          PYTHONPATH="${{ github.workspace }}/services/zoe-data" pytest \
            tests/integration/test_people_mempalace_sync.py \
            -x -q \
            --override-ini="asyncio_mode=auto"
        env:
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe

  # Are the dependency manifests still SATISFIABLE, and do their load-bearing
  # ceilings still hold?
  #
  # Nothing else checks this. The `validate` job installs a hand-written slim list,
  # never the manifests themselves, so a requirements.txt could become
  # unresolvable — or quietly resolve past `numpy<2` — and every check would stay
  # green until a deploy tried to install it on the Jetson.
  #
  # This resolves with `--dry-run` (metadata only, nothing is installed or built
  # into an environment) and then asserts the ceilings that exist for data-safety
  # rather than taste. `numpy<2` is the one that matters most: chromadb 0.6.3
  # declares a bare unbounded `numpy`, so without that ceiling a memory-store
  # install pulls NumPy 2.x, which is a C-ABI break for every compiled package on
  # this box (both canonical voice rocks plus the vector index).
  #
  # NOT branch-protected on purpose — it resolves against live PyPI, so an
  # upstream yank or outage could redden it, and a required check that depends on
  # a third party is how `main` freezes. Read it; promote it to required only once
  # it has shown itself stable.
  deps-resolvable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # MUST match the Jetson's interpreter — resolvability is
          # Python-version-specific. websockets 17 and av 18 install fine on 3.11
          # and not at all on 3.10, so resolving on the wrong version would bless
          # a manifest the box cannot install.
          python-version: '3.10'

      - name: Resolve every requirements manifest
        run: |
          set -euo pipefail
          FILES="
            services/zoe-data/requirements.txt
            services/zoe-auth/requirements.txt
            services/homeassistant-mcp-bridge/requirements.txt
            modules/zoe-music/requirements.txt
            labs/setfit-router/requirements.txt
          "
          for f in $FILES; do
            echo "::group::pip resolve $f"
            python3 -m pip install --dry-run --ignore-installed --quiet \
              --report "report.json" -r "$f"
            python3 - "$f" <<'PY'
          import json, sys
          from packaging.version import Version

          path = sys.argv[1]
          with open("report.json") as fh:
              report = json.load(fh)
          pkgs = {
              item["metadata"]["name"].lower().replace("_", "-"): item["metadata"]["version"]
              for item in report["install"]
          }
          print(f"{path}: resolved {len(pkgs)} packages")

          # Ceilings that protect DATA or a canonical rock, not preference.
          # Scoped PER FILE on purpose: zoe-data pulls bcrypt transitively through
          # `passlib[bcrypt]` and lets it float to 5.x, which is harmless there
          # (nothing in zoe-data hashes a password). The <5.0 ceiling is a zoe-auth
          # constraint, so asserting it repo-wide would fail on an unrelated
          # manifest and teach everyone to ignore this job.
          CEILINGS_BY_FILE = {
              "services/zoe-data/requirements.txt": {
                  "numpy": "2.0",     # C-ABI break for every compiled pkg on the Jetson
                  "chromadb": "0.7",  # on-disk palace format (see requirements comment)
              },
              "services/zoe-auth/requirements.txt": {
                  "bcrypt": "5.0",    # 5.0 turns >72-byte passwords into a ValueError
              },
              "labs/setfit-router/requirements.txt": {
                  "numpy": "2.0",     # must match the versions the router head was trained with
              },
          }
          ceilings = CEILINGS_BY_FILE.get(path, {})
          if not ceilings:
              print("  (no ceilings declared for this manifest — resolvability only)")
          failed = False
          for name, ceiling in ceilings.items():
              got = pkgs.get(name)
              if got is None:
                  continue
              if Version(got) >= Version(ceiling):
                  print(f"::error::{path}: {name}=={got} breaches the <{ceiling} ceiling")
                  failed = True
              else:
                  print(f"  ok: {name}=={got} < {ceiling}")
          sys.exit(1 if failed else 0)
          PY
            rm -f report.json
            echo "::endgroup::"
          done

      - name: Negative control — the guard must still be able to fail
        # A resolver check that cannot go red is not a check. Feed pip a genuinely
        # unsatisfiable pair and require a non-zero exit, every run. Same rule the
        # actionlint step follows above.
        run: |
          set -euo pipefail
          printf 'numpy<2\nnumpy>=2.1\n' > /tmp/known-bad-requirements.txt
          if python3 -m pip install --dry-run --ignore-installed --quiet \
               -r /tmp/known-bad-requirements.txt; then
            echo "::error::pip RESOLVED a contradictory manifest — this guard is not guarding"
            exit 1
          fi
          echo "negative control OK: pip rejects the known-unsatisfiable fixture"
          rm -f /tmp/known-bad-requirements.txt

  # Secret scanning as a MERGE-QUEUE-COMPATIBLE gate.
  #
  # The GitGuardian GitHub App cannot report on `merge_group`, so it can never be a
  # required check once a merge queue is enabled (GitHub: checks that only run on
  # pull_request will not execute during merge queue operations). This job is the
  # Action equivalent and inherits this workflow's merge_group trigger, so it CAN.
  # The App stays installed for its dashboard alerts and PR comments — only the
  # blocking gate moves here. See docs/knowledge/merge-queue-switch.md.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ggshield scans BRANCH HISTORY, not just the head tree: a credential in an
          # intermediate commit fails even when the final diff is clean. Full history
          # is required or the scan silently checks far less than it appears to.
          fetch-depth: 0

      - name: Skip on fork PRs (the secret is not available there)
        id: forkcheck
        # A fork PR cannot read repository secrets, so the explicit missing-key check
        # below would fail EVERY external contribution. The GitGuardian App still scans
        # fork PRs, so coverage is not lost — this only moves which gate reports.
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::notice::Fork PR — ggshield skipped (no secret access). The GitGuardian App still scans this PR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly if the scan gate is not actually configured
        if: steps.forkcheck.outputs.skip != 'true'
        # A missing or expired token must NOT look like a pass. This is the same rule
        # as the voice gate: an absent result is never a green one.
        run: |
          if [ -z "${{ secrets.GITGUARDIAN_API_KEY }}" ]; then
            echo "::error::GITGUARDIAN_API_KEY is not set — the secret-scan gate is NOT running."
            echo "Set it at Settings → Secrets and variables → Actions. Until then this check is meaningless."
            exit 1
          fi

      - name: GitGuardian scan
        if: steps.forkcheck.outputs.skip != 'true'
        uses: GitGuardian/ggshield-action@v1.53.0
        env:
          # `github.event.before` is all-zeros on a branch's first push and absent on
          # pull_request events — an invalid base makes ggshield scan the wrong range.
          # Blank it in that case so the action falls back to its own default.
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          # pull_request.base.sha is EMPTY on merge-queue runs. Without a base, ggshield
          # has nothing to diff against and would scan far less than it appears to — the
          # same silent-underscan failure as a shallow checkout. Fall back to the merge
          # group's base so the job stays meaningful under a queue.
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
