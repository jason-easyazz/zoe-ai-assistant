name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # Required checks must report on the merge_group event or a merge queue stalls
  # forever waiting for them (GitHub: "checks that only run on pull_request will not
  # execute during merge queue operations"). Harmless until a queue is enabled — no
  # merge_group events are produced without one. See docs/knowledge/merge-queue-switch.md.
  merge_group:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      CI_DB_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD || 'ci-postgres-pw' }}

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: zoe
          POSTGRES_USER: zoe
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD || 'ci-postgres-pw' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zoe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Slim install — avoids Jetson-specific packages (torch/onnx/whisper stacks)
      # that would timeout or fail on x86_64 GitHub runners.
      - name: Install slim CI deps
        run: |
          pip install --quiet \
            aiosqlite asyncpg psycopg2-binary alembic \
            fastapi "httpx>=0.27.0,<0.28" "apscheduler==3.10.4" "tzlocal>=2,<3" "sqlalchemy>=2.0,<3.0" \
            pydantic pywebpush py-vapid cryptography \
            "ag-ui-protocol==0.1.14" websockets python-jose passlib \
            python-multipart uvicorn prometheus-client "python-json-logger>=4.1.0"

      - name: Validate project structure
        run: python3 tools/audit/validate_structure.py

      - name: Validate critical files
        run: python3 tools/audit/validate_critical_files.py

      - name: Validate offline memory policy
        run: python3 tools/audit/validate_offline_memory.py

      - name: Run Alembic migrations on CI PostgreSQL
        run: |
          cd services/zoe-data
          POSTGRES_URL=postgresql://zoe:${CI_DB_PASSWORD}@localhost:5432/zoe \
            python3 -c "
          import os
          os.environ['POSTGRES_URL'] = f'postgresql://zoe:{os.environ[\"CI_DB_PASSWORD\"]}@localhost:5432/zoe'
          from alembic.config import Config
          from alembic import command as alembic_cmd
          cfg = Config('alembic.ini')
          cfg.set_main_option('sqlalchemy.url', f'postgresql+psycopg2://zoe:{os.environ[\"CI_DB_PASSWORD\"]}@localhost:5432/zoe')
          cfg.set_main_option('script_location', 'alembic')
          alembic_cmd.upgrade(cfg, 'head')
          print('Alembic migrations OK')
          "
        env:
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe

      - name: Python syntax check (all zoe-data modules)
        run: |
          find services/zoe-data -name "*.py" \
            -not -path "*/__pycache__/*" \
            -not -path "*/.pytest_cache/*" \
            | sort | xargs python3 -m py_compile
          echo "All Python files: syntax OK"

      # Run pure unit tests plus zoe-auth contract tests that use lightweight DB fakes.
      # Heavy tests requiring Jetson-specific packages (whisper, torch, MemPalace)
      # still run on the Jetson or during focused local validation.
      - name: Unit tests (pure logic and auth contracts)
        run: |
          pip install --quiet -r services/zoe-auth/requirements.txt
          # numpy: lets the ci_safe semantic_router/router-head tests actually run
          # in this slim lane (they fake the embedding model + head; no fastembed
          # or sklearn needed). Without it they importorskip -> silently skip.
          pip install --quiet "numpy<2"
          # zoe-data slim-dep-green tests are selected by the `ci_safe` marker
          # (registered in pytest.ini), not a hand-enumerated file list — so a new
          # slim-safe test runs here just by adding a co-located
          # `pytestmark = pytest.mark.ci_safe` line, no YAML edit. The full dir runs
          # on the Jetson (self-hosted-tests.yml) as the catch-all safety net, so an
          # UNMARKED new test still runs somewhere. See tests/AGENTS.md.
          # The cross-test isolation leak that used to force --deselect exclusions
          # here is FIXED: test_auth_unauthenticated (bisected as the necessary
          # poison) swapped in a new `auth` module object without restoring the
          # original, so later dependency_overrides keyed by the new object never
          # matched → guest verdicts → 403s. Its fixture now restores the saved
          # module IDENTITY (test_metrics_auth_regression got the same fix).
          pytest services/zoe-data/tests -m ci_safe \
            --ignore=services/zoe-data/tests/samantha_live \
            -x -q \
            --override-ini="asyncio_mode=auto"
          pytest \
            services/homeassistant-mcp-bridge/tests/test_ha_bridge.py \
            -x -q \
            --override-ini="asyncio_mode=auto"
          # Repo-root tests/unit uses the SAME marker lane as zoe-data (no
          # hand-enumerated file list — that list silently dropped every other
          # tests/unit file out of CI). Slim-dep-green files opt in with a
          # co-located `pytestmark = pytest.mark.ci_safe`; unmarked files
          # (live-service smokes, PyJWT/yaml-dependent) run in the full-dir
          # tests/unit catch-all on the Jetson (self-hosted-tests.yml).
          # test_remediate_ownerless_memories.py + test_memory_service_fixes.py
          # (the two formerly enumerated here) are ci_safe-marked, so they
          # still run in this lane. See tests/AGENTS.md.
          PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/services/zoe-data" pytest \
            tests/unit -m ci_safe \
            -x -q \
            --override-ini="asyncio_mode=auto"
          # Full zoe-auth suite — no hand enumeration (the old 4-file list
          # silently dropped test_oidc_login / test_rbac / test_security).
          PYTHONPATH="${{ github.workspace }}/services/zoe-auth:${{ github.workspace }}/services/zoe-auth/tests" pytest \
            services/zoe-auth/tests \
            -x -q
        env:
          PYTHONPATH: ${{ github.workspace }}/services/zoe-data
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe
          ZOE_DATA_DB: ":memory:"
          ZOE_MEMORY_STARTUP_STRICT: "false"

      - name: People MemPalace integration cleanup
        run: |
          PYTHONPATH="${{ github.workspace }}/services/zoe-data" pytest \
            tests/integration/test_people_mempalace_sync.py \
            -x -q \
            --override-ini="asyncio_mode=auto"
        env:
          POSTGRES_URL: postgresql://zoe:${{ env.CI_DB_PASSWORD }}@localhost:5432/zoe

  # Secret scanning as a MERGE-QUEUE-COMPATIBLE gate.
  #
  # The GitGuardian GitHub App cannot report on `merge_group`, so it can never be a
  # required check once a merge queue is enabled (GitHub: checks that only run on
  # pull_request will not execute during merge queue operations). This job is the
  # Action equivalent and inherits this workflow's merge_group trigger, so it CAN.
  # The App stays installed for its dashboard alerts and PR comments — only the
  # blocking gate moves here. See docs/knowledge/merge-queue-switch.md.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ggshield scans BRANCH HISTORY, not just the head tree: a credential in an
          # intermediate commit fails even when the final diff is clean. Full history
          # is required or the scan silently checks far less than it appears to.
          fetch-depth: 0

      - name: Fail loudly if the scan gate is not actually configured
        # A missing or expired token must NOT look like a pass. This is the same rule
        # as the voice gate: an absent result is never a green one.
        run: |
          if [ -z "${{ secrets.GITGUARDIAN_API_KEY }}" ]; then
            echo "::error::GITGUARDIAN_API_KEY is not set — the secret-scan gate is NOT running."
            echo "Set it at Settings → Secrets and variables → Actions. Until then this check is meaningless."
            exit 1
          fi

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
