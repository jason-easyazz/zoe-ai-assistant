name: Self-Hosted Tests

# Host-only integration/e2e suites that can ONLY run on the Jetson self-hosted
# runner (they import local service modules, start the FastAPI lifespan, and hit
# the live brain/DB — see tests/AGENTS.md). deploy.yml runs on the same runner
# but only curls health endpoints; it never runs pytest. This job is a SEPARATE,
# REPORTING-ONLY signal: it runs nightly on a schedule (the box's idle window)
# so those suites actually get exercised on real hardware without racing
# post-merge deploy/live-stack activity for memory.
#
# It does NOT gate or roll back deploys — deploy.yml owns deploy and runs
# independently, and this job is NOT a required status check, so a red night can
# never freeze `main`.
#
# A RED NIGHT MEANS RED (2026-10-19, architecture deep dive 2 lane K, T-1). Every
# pytest step here used to be `continue-on-error: true`, so the run concluded
# `success` whatever its suites did — and for at least 14 nights it did nothing:
# `tests/integration tests/e2e` and the `tests/unit` catch-all died in COLLECTION
# (zero tests ran), and the full zoe-data suite carried 16-19 failures, among them
# both XSS guards and the auth-no-demo-bypass harness, which fail CLOSED when `node`
# is absent (the runner service has no nvm on PATH). The fail-closed tests were
# defeated by a fail-open workflow. Now:
#   * no pytest step is `continue-on-error`; each runs even if a sibling failed
#     (`!cancelled()`), and the job is red if any of them is;
#   * every suite goes through scripts/maintenance/pytest_junit_guard.py, which
#     FAILS a run with a collection error or fewer executed tests than a floor
#     (zero-collected, or everything skipped, can no longer read green);
#   * node is put on PATH explicitly, and the job fails loudly if it is missing;
#   * a test that cannot pass on this box is fixed or carries a dated, ledgered
#     skip (docs/knowledge/open-problems.md, "Test instruments honesty").
# tests/unit/test_self_hosted_tests_workflow.py pins all of it.

on:
  schedule:
    # Nightly in the Jetson's idle trough instead of on every push to main.
    # Post-merge pushes land exactly when deploy.yml and the live stack are
    # busiest, which is why the on-push lane flatlined on the memory-headroom
    # gate (every recent run failed the gate; pytest never executed — verified
    # run 30009735855). Cron is UTC; 16:30 UTC lands in the box's overnight
    # window. One run a day is enough for a reporting-only signal, and it
    # samples the box when headroom is actually available. Adjust the hour if
    # measurement shows a deeper idle trough.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      run_live_memory:
        description: "Also run the samantha_live memory suite (ZOE_LIVE_TESTS=1; needs live Gemma)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize with itself so overlapping runs (scheduled + manual dispatch)
  # don't fight over the shared checkout / live services on the single Jetson
  # runner. Keep it separate
  # from deploy.yml's `production` group so it never blocks a deploy.
  group: self-hosted-tests
  cancel-in-progress: false

jobs:
  host-tests:
    # Same self-hosted Jetson runner as deploy.yml.
    runs-on: self-hosted
    # Hard cap so a hung/stalled test can never hold the shared Jetson runner (and
    # queue deploys behind it) for the 6h GitHub default; a step that STALLS never
    # exits, so only this timeout bounds that case. 45 min: the three suites now
    # all actually run (the full zoe-data suite alone is ~10 min, tests/unit and
    # the integration lane were previously dead in collection and cost ~0).
    timeout-minutes: 45

    env:
      # Mirror the PYTHONPATH the validate.yml / repo pytest.ini use so local
      # service imports (routers, zoe_agent, mcp_server) resolve.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/zoe-data
      # Keep these suites off any real identity / live memory unless explicitly
      # opted in via the workflow_dispatch input below.
      ZOE_MEMORY_STARTUP_STRICT: "false"

    steps:
      # MEMORY-HEADROOM GATE (self-hosted only — this job shares the Jetson with
      # the LIVE llama-server brain). Verified 2026-07-19: a CI burst pushed
      # MemAvailable low enough that the running brain hit CUDA/NvMap allocation
      # failure and crash-looped — unified memory, so cgroup guards do NOT cover
      # GPU allocations. Wait for headroom before running anything heavy.
      # Threshold 800MB: aligned with deploy.yml's job-level gate, which the box
      # demonstrably meets. The previous 1800MB threshold flatlined this lane —
      # the box actually idles at ~358–939MB free, so the gate failed on every
      # run and pytest never executed anywhere (verified run 30009735855).
      # 800MB + the scheduled overnight window (see `on:`) keeps the heavy
      # suites out of the brain's observed kill zone while letting the lane
      # actually run; the skip-streak guard at the end of the job makes any
      # renewed flatline loud instead of silent.
      - name: Wait for memory headroom (protect the live brain)
        id: mem_gate
        timeout-minutes: 10
        run: |
          THRESHOLD_MB=800
          for attempt in $(seq 1 36); do
            AVAIL_MB="$(free -m | awk '/Mem:/{print $7}')"
            if [ "${AVAIL_MB}" -ge "${THRESHOLD_MB}" ]; then
              echo "Memory headroom OK: ${AVAIL_MB}MB available (>= ${THRESHOLD_MB}MB)."
              exit 0
            fi
            echo "Waiting for memory headroom: ${AVAIL_MB}MB available (< ${THRESHOLD_MB}MB); retry in 15s (${attempt}/36)."
            sleep 15
          done
          echo "::error::Jetson is memory-starved: ${AVAIL_MB}MB available after ~9min, need >= ${THRESHOLD_MB}MB. Refusing to run heavy CI next to the live brain (unified memory — a CI burst here has crash-looped llama-server before). Operator: free memory on the box (check the brain's RSS, stray pytest/chromium, VmSwap of the :8000 pid), then re-run."
          exit 1

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      # The JS harness tests (XSS guards, sign-in security, estate resilience, ...) run
      # `node` and FAIL CLOSED under CI when it is missing, on purpose: a skip would let a
      # guard quietly stop guarding. The runner service is a systemd --user unit whose PATH
      # has no nvm (its `.path`/`.env` name a version dir that is not on the service's
      # actual PATH), so `node` was absent in every nightly: 18 zoe-data harness failures
      # and 3 tests/unit collection errors (the workflow tests raise at import). Same fix
      # as deploy.yml's flue rebuild: put nvm's ACTIVE-version bin (the `current` symlink,
      # which survives node upgrades — a pinned vX.Y.Z dir does not) on PATH. $GITHUB_PATH
      # carries it to every later step. Fail HERE, loudly, if it still is not there.
      - name: Put node on PATH (the JS harnesses fail closed without it)
        id: node
        run: |
          NODE_BIN="${HOME}/.nvm/current/bin"
          if [ ! -x "${NODE_BIN}/node" ]; then
            echo "::error::node is not at ${NODE_BIN}/node — the ~20 JS harness tests (both XSS guards, sign-in security, estate resilience) cannot run and will fail closed. Operator: re-point ~/.nvm/current at an installed node (nvm alias default / ln -sfn)."
            exit 1
          fi
          echo "${NODE_BIN}" >> "$GITHUB_PATH"
          "${NODE_BIN}/node" --version

      # WHICH PYTHON THE SUITES RUN ON (2026-10-19, found while fixing T-1). Since the B0.7
      # cutover the zoe-data SERVICE runs the 3.12 venv, and B0.8 moved the palace to
      # chromadb 1.5.x — which is installed THERE and nowhere else. The system python3 this
      # workflow used to call is the rollback interpreter: it no longer has chromadb at all
      # (every MemPalace test skips or fails on import), and its last known chromadb was the
      # pre-cutover 0.6.3, against which test_memory_physical_erase failed — a "failure" that
      # was an artifact of testing an environment nothing runs. Measured on this box: the same
      # 77 memory / voice-lane-parity tests that failed under system python all PASS in the
      # service venv. So resolve the interpreter exactly as the drift check and the voice gate
      # do (scripts/deploy/zoe_data_python.sh: systemd is the authority) and fall back to
      # system python3 only when the unit has not left it (a rollback).
      # The venv deliberately has no pytest (a runtime venv must stay minimal and
      # `requirements --check` fails on extras), so pytest comes from an OVERLAY directory put
      # first on PYTHONPATH — the recipe in docs/knowledge/python-312-venv-migration.md §5.
      - name: Test interpreter — the zoe-data service's python plus a pytest overlay
        id: interp
        # Not gated on the node step: a missing node must not also hide which interpreter ran.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          cd "${{ github.workspace }}"
          OVERLAY="${HOME}/.cache/zoe/py312-pytest-overlay"
          if VENV="$(bash scripts/deploy/zoe_data_python.sh --venv-dir)" && [ -n "${VENV}" ]; then
            PY="${VENV}/bin/python"
            if ! PYTHONPATH="${OVERLAY}" "${PY}" -c "import pytest, pytest_asyncio" 2>/dev/null; then
              UV="${HOME}/.local/bin/uv"
              if [ ! -x "${UV}" ]; then
                echo "::error::the service venv has no pytest and ${UV} is missing, so the overlay cannot be built — the nightly cannot run on the interpreter production uses."
                exit 1
              fi
              mkdir -p "${OVERLAY}"
              "${UV}" pip install --quiet --python "${PY}" --target "${OVERLAY}" "pytest==8.3.5" "pytest-asyncio==1.3.0"
            fi
            PYTHONPATH="${OVERLAY}" "${PY}" -c "import pytest, pytest_asyncio; print('pytest', pytest.__version__)"
            TEST_PY="${PY}"
            echo "ZOE_TEST_PYTHON=${PY}" >> "$GITHUB_ENV"
            echo "ZOE_TEST_OVERLAY=${OVERLAY}:" >> "$GITHUB_ENV"
          else
            echo "::warning::zoe-data is not on a venv (rollback to system python3): the suites run on python3, which has no chromadb — MemPalace tests will skip."
            TEST_PY=python3
            echo "ZOE_TEST_PYTHON=python3" >> "$GITHUB_ENV"
            echo "ZOE_TEST_OVERLAY=" >> "$GITHUB_ENV"
          fi
          "${TEST_PY}" --version

      # The self-hosted runner is NOT a fresh box: it's the Jetson that already
      # runs the live stack, so the Jetson-specific Python deps (torch, onnx,
      # whisper, MemPalace, etc.) are already installed for the user that owns
      # the runner. We intentionally do NOT pip-install the heavy requirements
      # here (that's ~3 GB and would fight the live services). Record the
      # interpreter for the run log so drift is visible.
      - name: Show Python environment
        run: |
          python3 --version
          python3 -c "import sys; print('executable:', sys.executable)"

      # "Drift is visible" above was aspirational: printing the interpreter says
      # nothing about which PACKAGE VERSIONS it has. Nothing installs
      # services/zoe-data/requirements.txt (deploy.yml has its own hardcoded
      # list; the Dockerfile that does `pip install -r` it has no compose
      # service), so the file and this box drift silently — measured 2026-08-06,
      # three exact pins disagreed and three listed packages were absent.
      #
      # This is the ONLY lane that can answer the question: the packages exist
      # here and nowhere else in CI. Reporting-only, matching the suites below —
      # a legitimately-ahead box must not block a merge, it must be VISIBLE.
      # Read-only: it imports metadata, never installs or touches the live env.
      # Comparator logic is covered offline (with a negative control) by
      # tests/unit/test_requirements_drift_check.py.
      #
      # B0.7: compare against what the zoe-data SERVICE runs, read from systemd
      # (scripts/deploy/zoe_data_python.sh) — the 3.12 venv against
      # requirements-py312.txt after the cutover, system python3 against
      # requirements.txt before it or after a rollback. Checking the 3.10
      # site-packages once the service has left it would report drift in an
      # environment nothing loads.
      # The ONE remaining continue-on-error in this file, and it is not a test: it is a
      # version-drift REPORT that a legitimately-ahead box would otherwise turn red. It is
      # surfaced in the run summary below. tests/unit/test_self_hosted_tests_workflow.py
      # pins that nothing else gets the flag.
      - name: Dependency drift — declared vs installed (reporting-only)
        id: drift
        continue-on-error: true
        run: |
          cd "${{ github.workspace }}"
          if VENV="$(bash scripts/deploy/zoe_data_python.sh --venv-dir)" && [ -n "${VENV}" ]; then
            "${VENV}/bin/python" scripts/maintenance/requirements_drift_check.py \
              services/zoe-data/requirements-py312.txt
          else
            python3 scripts/maintenance/requirements_drift_check.py \
              services/zoe-data/requirements.txt
          fi

      # Host-only integration + e2e suites. Reporting-only: allowed to fail so a
      # red suite is visible in the summary without failing the workflow or
      # touching deploy. Uses the repo pytest.ini (asyncio_mode=auto) and the
      # PYTHONPATH set at job level.
      - name: Integration + e2e tests
        id: host_suites
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH="${ZOE_TEST_OVERLAY}${PYTHONPATH}" python3 scripts/maintenance/pytest_junit_guard.py \
            --label integration-e2e --min-tests 55 --max-skipped 25 -- \
            "${ZOE_TEST_PYTHON:?the interp step did not set ZOE_TEST_PYTHON}" -m pytest tests/integration tests/e2e -q --continue-on-collection-errors

      # These suites exercise the LIVE service (POST /api/chat/ etc.) and leave
      # real rows behind — 'Dentist Appointment' calendar spam on the panel
      # (operator bug report 2026-07-13). Always sweep the orphaned guest/test
      # rows afterwards: reversible soft-delete of calendar/list rows scoped to
      # guest + test-sec-b owners, plus a HARD delete of chat sessions owned by
      # the probe ids `test-route-probe` / `test-sec-b-<6 hex>` (exact, anchored
      # — never a real household user's data). Runs nightly, before the 03:00
      # memory digest.
      # NOT continue-on-error: if this sweep fails, junk stays on the live
      # panel — the workflow must go red so it gets fixed, not ignored.
      - name: Clean up live test artifacts
        if: always()
        run: |
          cd "${{ github.workspace }}"
          python3 scripts/maintenance/purge_orphaned_test_data.py --execute --yes \
            --expect-db zoe --expect-host localhost:5432

      # Full service-local zoe-data suite — the catch-all safety net that closes
      # the recurring silent-skip: validate.yml only runs the `-m ci_safe` subset
      # on the slim GitHub runner, so a NEW services/zoe-data/tests/*.py that is
      # NOT (yet) marked ci_safe would otherwise run NOWHERE. The Jetson HAS
      # MemPalace + the live services, so it can run the whole directory. Picks up
      # every new test with ZERO enumeration. A red test fails THIS job (not deploys,
      # not merges — the job is not a required check); a test that cannot pass on this
      # box is fixed or carries a dated, ledgered skip, never a swallowed exit code.
      # samantha_live self-skips (collects 0) unless ZOE_LIVE_TESTS=1 — see
      # services/zoe-data/tests/samantha_live/AGENTS.md — so it needs no --ignore.
      - name: Full zoe-data suite (catch-all)
        id: zoe_data_full
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH="${ZOE_TEST_OVERLAY}${PYTHONPATH}" python3 scripts/maintenance/pytest_junit_guard.py \
            --label zoe-data-full --min-tests 18000 --max-skipped 100 -- \
            "${ZOE_TEST_PYTHON:?the interp step did not set ZOE_TEST_PYTHON}" -m pytest services/zoe-data/tests -q --continue-on-collection-errors

      # Same catch-all for the repo-root tests/unit directory: validate.yml runs
      # only its `-m ci_safe` subset on the slim GitHub runner, so an UNMARKED
      # tests/unit file (live-service smokes, Jetson-dep tests, new files nobody
      # marked yet) would otherwise run NOWHERE. Zero enumeration; red fails the job.
      - name: Full tests/unit suite (catch-all)
        id: unit_full
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH="${ZOE_TEST_OVERLAY}${PYTHONPATH}" python3 scripts/maintenance/pytest_junit_guard.py \
            --label unit-full --min-tests 4300 --max-skipped 150 -- \
            "${ZOE_TEST_PYTHON:?the interp step did not set ZOE_TEST_PYTHON}" -m pytest tests/unit -q --continue-on-collection-errors

      # Live Samantha memory proofs. Self-skips (collects 0 items) unless
      # ZOE_LIVE_TESTS=1 AND live Gemma is reachable — see
      # services/zoe-data/tests/samantha_live/AGENTS.md. Only armed on manual
      # dispatch with the run_live_memory input, since it writes to the live
      # memory store (demo users only) and needs the model server up. Collecting 0
      # (pytest exit 5, e.g. Gemma unreachable) is a RED result here on purpose: the
      # operator asked for live proofs and none ran.
      - name: Samantha live memory suite (opt-in)
        id: live_suite
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_live_memory }}
        env:
          ZOE_LIVE_TESTS: "1"
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH="${ZOE_TEST_OVERLAY}${PYTHONPATH}" "${ZOE_TEST_PYTHON}" -m pytest services/zoe-data/tests/samantha_live -q

      # Outcomes in the run summary. These are REAL conclusions now (no step above is
      # continue-on-error except the dependency-drift report, which is not a test).
      - name: Report result
        if: ${{ always() }}
        run: |
          echo "Dependency drift (non-test report) outcome: ${{ steps.drift.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Integration + e2e outcome: ${{ steps.host_suites.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Full zoe-data suite (catch-all) outcome: ${{ steps.zoe_data_full.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Full tests/unit suite (catch-all) outcome: ${{ steps.unit_full.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Samantha live memory outcome: ${{ steps.live_suite.outcome || 'not run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A red suite fails this job. The job is not a required check: it does not gate merges or roll back deploys." >> "$GITHUB_STEP_SUMMARY"

      # SKIP-STREAK GUARD — the failure mode this lane had was SILENCE: the
      # headroom gate failed every run, pytest never executed, and the red runs
      # looked like routine noise. Track consecutive runs that never reached
      # pytest in a counter file on the runner (the long-lived Jetson, not an
      # ephemeral VM, so the file persists across runs with no token/API needed)
      # and escalate loudly once the streak hits the limit, so a flatlined lane
      # is unmissable instead of routine red.
      - name: Skip-streak guard (loud alarm when pytest keeps not running)
        if: ${{ always() }}
        run: |
          STREAK_LIMIT=3
          STREAK_DIR="${HOME}/.zoe-ci"
          STREAK_FILE="${STREAK_DIR}/self-hosted-tests-skip-streak"
          mkdir -p "${STREAK_DIR}"
          # Key the streak on the memory gate ITSELF, not on host_suites being
          # 'skipped'. host_suites is also skipped when any earlier step fails —
          # a Checkout failure (network blip, token expiry, disk full) would
          # otherwise increment the streak and, after three, fire the flatline
          # alarm and fail the workflow even though the gate passed and pytest
          # was never blocked by memory at all.
          # Match "success" EXPLICITLY rather than "not failure". A cancelled
          # gate (job timeout, manual cancel) is not a pass: treating it as one
          # zeroes a genuine streak, so a lane that keeps timing out before
          # reaching pytest looks healthy. Leave the streak untouched instead —
          # neither cleared nor counted, since we learned nothing this run.
          GATE="${{ steps.mem_gate.outcome }}"
          SUITES="${{ steps.host_suites.outcome }}"
          if [ "${GATE}" != "success" ] && [ "${GATE}" != "failure" ]; then
            echo "Memory gate ended '${GATE}' (not a pass and not a memory block) — streak left unchanged at $(cat "${STREAK_FILE}" 2>/dev/null || echo 0)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${GATE}" = "success" ]; then
            echo 0 > "${STREAK_FILE}"
            if [ "${SUITES}" = "success" ] || [ "${SUITES}" = "failure" ]; then
              echo "Pytest executed this run; gate-skip streak reset to 0." >> "$GITHUB_STEP_SUMMARY"
            elif [ "${SUITES}" = "cancelled" ]; then
              # Started but cut off (e.g. the job's time cap). Saying "executed"
              # here hides a lane that repeatedly runs out of time.
              echo "Memory gate passed but pytest was CANCELLED mid-run (job time cap?) — streak reset to 0, but this run proved nothing." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Memory gate passed but pytest did not run (an earlier step failed — check Checkout); streak NOT incremented, reset to 0." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          PREV="$(cat "${STREAK_FILE}" 2>/dev/null || echo 0)"
          case "${PREV}" in
            ''|*[!0-9]*) PREV=0 ;;
          esac
          STREAK=$((PREV + 1))
          echo "${STREAK}" > "${STREAK_FILE}"
          echo "Pytest did NOT run this time; consecutive gate-skip streak: ${STREAK} (alarm at ${STREAK_LIMIT})." >> "$GITHUB_STEP_SUMMARY"
          if [ "${STREAK}" -ge "${STREAK_LIMIT}" ]; then
            echo "::error::Self-hosted test lane has not reached pytest for ${STREAK} consecutive runs — the memory-headroom gate is blocking every run, so tests/e2e, full tests/integration, and the full zoe-data + tests/unit suites are running NOWHERE. This is a flatlined lane, not routine red: free memory on the Jetson or re-tune THRESHOLD_MB / the schedule window, then re-run."
            exit 1
          fi
