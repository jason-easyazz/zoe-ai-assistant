# Greptile is the LAST reviewer, and this workflow is what enforces that.
#
# Greptile is filtered (dashboard) to only review PRs carrying the `greptile` label.
# Without the label it ignores the PR entirely and costs nothing. This job adds the
# label only once every OTHER reviewer has reported success, so the ordering is a rule
# rather than a habit, and Greptile's single review lands on the final, up-to-date head.
#
# WHY THAT ORDERING IS LOAD-BEARING (learned the hard way, 2026-07-26):
# Greptile deduplicates by PR diff. If it reviews early and `strict` then forces a
# branch update, it correctly refuses to re-review the unchanged diff — leaving the
# required check stranded on the previous commit and the PR permanently unmergeable.
# Reviewing once, last, on an already-current head avoids that entirely, and drops the
# cost from ~3.6 reviews per PR to one.
name: greptile-gate

on:
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  # Never race two labellers on the same PR.
  group: greptile-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  label-when-others-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Add the greptile label once the other reviewers are green
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'greptile';
            // The reviewers that must finish FIRST. Greptile is deliberately absent.
            const REQUIRED = ['Cursor Bugbot'];
            const REQUIRED_REVIEWERS = ['copilot-pull-request-reviewer', 'chatgpt-codex-connector'];

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });

            for (const pr of prs) {
              if (pr.draft) continue;                       // drafts iterate for free
              if (pr.labels.some(l => l.name === LABEL)) continue;   // already gated through

              // Every required CHECK must have concluded successfully on the CURRENT head.
              const { data: runs } = await github.rest.checks.listForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: pr.head.sha, per_page: 100,
              });
              const byName = new Map(runs.check_runs.map(c => [c.name, c]));
              const checksOk = REQUIRED.every(n => byName.get(n)?.conclusion === 'success');

              // ...and every required REVIEWER must have actually reviewed that head.
              // A reviewer that has not run yet is NOT a pass — silence is not success.
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100,
              });
              const reviewedHead = new Set(
                reviews.filter(r => r.commit_id === pr.head.sha)
                       .map(r => (r.user?.login || '').replace(/\[bot\]$/, ''))
              );
              const reviewersOk = REQUIRED_REVIEWERS.every(r => reviewedHead.has(r));

              // Unresolved conversations mean the cheap tier is not finished with it.
              const { data: prFullEarly } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
              });
              const upToDate = prFullEarly.mergeable_state !== 'behind';

              // SUMMON the cheap reviewers if they have not reviewed this head. Both are
              // manual-trigger only, so without this the gate waits forever for reviews
              // nobody asked for — verified by simulation against live PRs before merge:
              // every open PR held on reviewers=false, and would have held indefinitely.
              // They are summoned differently: Copilot via requestReviewers ("Copilot" —
              // the [bot] login does NOT resolve), Codex via an @codex comment.
              if (!reviewersOk) {
                const requested = new Set((prFullEarly.requested_reviewers || []).map(r => r.login));
                if (!reviewedHead.has('copilot-pull-request-reviewer') && !requested.has('Copilot')) {
                  try {
                    await github.rest.pulls.requestReviewers({
                      owner: context.repo.owner, repo: context.repo.repo,
                      pull_number: pr.number, reviewers: ['Copilot'],
                    });
                    core.info(`PR #${pr.number}: requested Copilot`);
                  } catch (e) { core.info(`PR #${pr.number}: could not request Copilot — ${e.message}`); }
                }
                if (!reviewedHead.has('chatgpt-codex-connector')) {
                  // Only ask once per head: look for our own prior summon on this SHA.
                  const comments = await github.paginate(github.rest.issues.listComments, {
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: pr.number, per_page: 100,
                  });
                  const marker = `<!-- greptile-gate:codex:${pr.head.sha} -->`;
                  if (!comments.some(c => c.body?.includes(marker))) {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner, repo: context.repo.repo,
                      issue_number: pr.number, body: `@codex review\n${marker}`,
                    });
                    core.info(`PR #${pr.number}: summoned Codex`);
                  }
                }
              }

              if (!(checksOk && reviewersOk && upToDate)) {
                core.info(`PR #${pr.number}: not ready — checks=${checksOk} reviewers=${reviewersOk} upToDate=${upToDate}`);
                continue;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, labels: [LABEL],
              });
              core.notice(`PR #${pr.number}: other reviewers green and branch current — handing off to Greptile.`);
            }
