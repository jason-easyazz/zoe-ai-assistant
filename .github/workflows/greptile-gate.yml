# Greptile is ADVISORY. This workflow is a COST CONTROLLER, not a merge gate.
#
# WHAT CHANGED AND WHY (the re-tiering, 2026-07-30):
# Greptile is a non-deterministic SaaS reviewer. It was never a required context
# in branch protection, but this workflow was built as though it were about to
# become one, and grew the machinery that implies: cross-PR shared-SHA
# coordination, Copilot bounded-grace summons with forgery-resistant markers,
# a full SHA-revalidation lifecycle, and a `checksOk` term reading an EMPTY
# `REQUIRED_CHECKS` list — vacuously true, so the condition it looked like it
# enforced was enforcing nothing at all. ~573 lines of inline JavaScript whose
# only CI coverage was actionlint, and the source of an 11-round fail-open
# cascade in review.
#
# The merge gate is now DETERMINISTIC and locally runnable — `validate`,
# `secret-scan`, `voice-gate` — and semantic review is the cross-vendor diff
# review (flat-rate, in-house). Greptile stays as an advisory reviewer for
# high-risk changes. See AGENTS.md "Review pipeline" for the full tiering.
#
# WHAT THIS FILE STILL DOES, AND WHY IT IS WORTH KEEPING:
# Greptile is dashboard-filtered to PRs carrying the `greptile` label, so without
# the label it ignores the PR and costs nothing. Applying that label only once a
# PR is settled — up to date with `main` and with no unresolved threads — is what
# keeps Greptile's billed review landing ONCE, on a final head. That ordering is
# still load-bearing and still measured: Greptile dedups by PR diff, so a review
# on an early head followed by a `strict` branch update means it correctly
# refuses to re-review, and the spend bought nothing. This is the cheapest form
# of that control, with nothing left that pretends to gate a merge.
name: greptile-gate

on:
  check_suite:
    types: [completed]
  # ready_for_review is not optional: if the cheap tier finishes while the PR is
  # still a draft, no other event fires when it is marked ready, and the gate
  # would never run for that PR at all.
  pull_request:
    types: [ready_for_review, synchronize, opened]
  # NOTE: thread-resolution has NO workflow trigger. `pull_request_review_thread`
  # is a real webhook event but NOT a valid `on:` event — with it present the file
  # failed GitHub's parser and the workflow never executed at all (every push run
  # was a zero-job parse failure; actionlint catches it, PyYAML does not).
  # Resolving the last thread is picked up by the schedule below instead, worst
  # case ~30min later. Slower than an event, but a gate that runs slowly beats one
  # that never parses. This is also the only wake-up for anything here that is not
  # event-driven.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  # Deliberately GLOBAL, not per-PR. This job sweeps every open PR, and on
  # check_suite events there is no `pull_request.number` to key on — a run_id
  # fallback is unique per run and would give no protection whatsoever.
  group: greptile-gate
  cancel-in-progress: false

jobs:
  label-when-settled:
    # check_suite fires for EVERY suite in the repo, including pushes to main —
    # and this job sweeps all open PRs, so suites with no associated PR would burn
    # API budget for nothing. Skip those. Trade-off, stated: a main-push suite
    # correlates with a merge that puts other PRs BEHIND, so skipping it delays
    # behind-ness detection by up to one schedule tick (30min) — acceptable, the
    # label self-corrects and Greptile ignores drafts. Note check_suite.pull_requests
    # omits fork PRs; this repo works from same-repo branches, where it is populated.
    if: github.event_name != 'check_suite' || github.event.check_suite.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Label + summon Greptile once a PR is settled
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'greptile';
            // Max Greptile summons per head before the gate stops asking.
            const MAX_SUMMONS = 3;

            const ok = async (label, fn) => {
              try { return await fn(); }
              catch (e) { core.warning(`${label}: ${e.message}`); return null; }
            };

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });

            for (const pr of prs) {
              if (pr.draft) continue;
              const base = { owner: context.repo.owner, repo: context.repo.repo };

              // Every list is PAGINATED. A long-lived PR exceeds 100 comments or
              // threads, and a truncated list silently reads as "nothing
              // outstanding" — the exact false-clear this ordering exists to avoid.
              const comments = await ok(`PR #${pr.number} comments`, () =>
                github.paginate(github.rest.issues.listComments, {
                ...base, issue_number: pr.number, per_page: 100,
              }));
              if (!comments) { core.info(`PR #${pr.number}: could not read comments — holding`); continue; }

              const MARK = '<!-- greptile-gate:labelled:';
              // TRUST, not presence. This repo is PUBLIC, so anyone can post a
              // comment containing the marker string. An unfiltered match lets a
              // stranger forge a handoff — making the gate believe a PR was already
              // cleared, or pinning it to a SHA of their choosing. ONLY this
              // workflow's own bot: author_association was tried and is wrong, since
              // MEMBER and COLLABORATOR do not imply write permission. There is no
              // legitimate human-authored marker either.
              const trusted = (c) =>
                c.user?.login === 'github-actions[bot]' && c.user?.type === 'Bot';
              // Explicit chronology: "newest marker wins" must not lean on the REST
              // default ordering (ascending id — documented, but implicit here). The
              // issue-comments endpoint has no sort parameter, so order in code.
              const byCreated = (a, b) =>
                new Date(a.created_at || 0) - new Date(b.created_at || 0);
              const marks = comments.filter(c => c.body?.includes(MARK) && trusted(c))
                                    .sort(byCreated);

              // Refetch BEFORE anything reads a SHA. `pulls.list` was fetched once at
              // the top of the sweep, so by the time this PR is processed its head may
              // have moved — and every downstream decision keys on it: the stale-label
              // comparison, the summon marker, the handoff marker. One authoritative
              // `sha`, established here; `pr.head.sha` is never read again. `labels`
              // and `draft` come from here too — a stale label snapshot silently
              // disables the stale-label repair path.
              const prFull = await ok(`PR #${pr.number} get`, () =>
                github.rest.pulls.get({ ...base, pull_number: pr.number }).then(r => r.data));
              if (!prFull) continue;
              const sha = prFull.head.sha;
              const baseRef = prFull.base.ref;
              if (prFull.draft) {
                // The cheap `pr.draft` filter above avoids a fetch in the common case,
                // but the snapshot ages: a PR marked draft since the sweep started must
                // not be labelled. (The opposite drift — draft in the list, ready now —
                // is self-correcting; the schedule picks it up next pass.)
                core.info(`PR #${pr.number}: became a draft during the sweep — skipping`);
                continue;
              }

              // Behind-ness is MEASURED, not inferred from mergeable_state, which mixes
              // concerns and can be `unknown` while GitHub computes it.
              const cmp = await ok(`PR #${pr.number} compare`, () =>
                github.rest.repos.compareCommits({ ...base, base: baseRef, head: sha })
                  .then(r => r.data));
              if (!cmp) { core.info(`PR #${pr.number}: could not compare — holding`); continue; }
              const upToDate = cmp.behind_by === 0;

              // Paginate: `first: 100` silently truncates, and a truncated page reads
              // as "no unresolved threads".
              let unresolved = 0, cursor = null, threadsOk = true;
              do {
                const q = await ok(`PR #${pr.number} threads`, () => github.graphql(`
                  query($owner:String!,$repo:String!,$num:Int!,$cursor:String){
                    repository(owner:$owner,name:$repo){
                      pullRequest(number:$num){
                        reviewThreads(first:100, after:$cursor){
                          pageInfo{ hasNextPage endCursor } nodes{ isResolved } } } } }`,
                  { owner: base.owner, repo: base.repo, num: pr.number, cursor }));
                if (!q) { threadsOk = false; break; }
                const t = q.repository.pullRequest.reviewThreads;
                unresolved += t.nodes.filter(n => !n.isResolved).length;
                cursor = t.pageInfo.hasNextPage ? t.pageInfo.endCursor : null;
              } while (cursor);
              if (!threadsOk) { core.info(`PR #${pr.number}: could not read threads — holding`); continue; }

              const labelledSha = marks.length
                ? marks[marks.length - 1].body.split(MARK)[1].split('-->')[0].trim()
                : null;
              const isLabelled = (prFull.labels || []).some(l => l.name === LABEL);
              const alreadyHandedOff = isLabelled && labelledSha === sha;

              if (isLabelled && !alreadyHandedOff) {
                // Stale (the head moved) or unknown provenance (applied by hand, or the
                // marker comment was deleted). Strip it so the PR re-qualifies rather
                // than sitting inside Greptile's filter and being re-reviewed — and
                // re-billed — on every single push.
                const r = await ok(`PR #${pr.number} removeLabel`, () =>
                  github.rest.issues.removeLabel({ ...base, issue_number: pr.number, name: LABEL }));
                if (!r) {
                  core.warning(`PR #${pr.number}: label could NOT be removed — still inside Greptile's filter`);
                  continue;
                }
                core.info(`PR #${pr.number}: stale label removed — re-qualifying in this same pass`);
                // Deliberately NO `continue`: fall through and re-evaluate now. Waiting
                // for the next event would stall a PR that is otherwise ready, and there
                // may not BE another event.
              }

              // A run only has a meaningful `conclusion` once `status === 'completed'`.
              // cancelled/timed_out/stale are infra deaths on an immutable head and must
              // not suppress a re-summon forever; a completed success/failure is a real
              // verdict and does. `skipped` is DEAD too: Greptile deliberately skips PRs
              // over ~50 files, and counting that skip as LIVE strands the PR
              // labeled-but-never-reviewed with the credit already spent. Re-summoning
              // an oversized PR gains nothing but is harmless, and the ATTEMPTS are
              // bounded by MAX_SUMMONS below.
              const DEAD = ['cancelled', 'timed_out', 'stale', 'skipped'];
              const liveGreptileRuns = () => ok(`PR #${pr.number} greptile check`, () =>
                github.paginate(github.rest.checks.listForRef, { ...base, ref: sha, per_page: 100 })
                  .then(rs => rs.filter(c => c.name === 'Greptile Review'
                                          && !(c.status === 'completed' && DEAD.includes(c.conclusion))).length));

              // Summon bookkeeping, shared by both the handed-off and fresh-handoff
              // paths. Debounce PER HEAD: Greptile takes real time to CREATE its check
              // run after a summon, and a PR-wide match let the OLD head's summon
              // suppress the NEW head's, leaving a fresh push unreviewed. The attempt
              // CAP is separate from the debounce: a 10-minute recency rule has no
              // limit, so an oversized PR would accrue a summon every ten minutes
              // forever. A new head resets the count because the marker is sha-scoped.
              const summonMark = `<!-- greptile-gate:summon:${sha} -->`;
              const summonsForHead = comments.filter(c =>
                trusted(c) && (c.body || '').includes(summonMark));
              const recentSummon = summonsForHead.some(c =>
                (Date.now() - new Date(c.created_at)) < 10 * 60 * 1000);
              const summonsExhausted = summonsForHead.length >= MAX_SUMMONS;

              const summonGreptile = async (why) => {
                const live = await liveGreptileRuns();
                if (live === null) {
                  // Fail-closed with an HONEST log: unreadable is not knowledge, so no
                  // summon this sweep. Every later event and the 30-min schedule retry.
                  core.warning(`PR #${pr.number}: could not read Greptile runs — retrying next sweep`);
                  return;
                }
                if (live !== 0) {
                  core.info(`PR #${pr.number}: live Greptile run already exists for this head — no fresh summon`);
                  return;
                }
                if (summonsExhausted) {
                  core.warning(`PR #${pr.number}: Greptile summoned ${summonsForHead.length}x on this ` +
                    `head with no live run — not asking again. Most likely the PR exceeds Greptile's ` +
                    `~50-file skip limit (split it), or the account is out of credits.`);
                  return;
                }
                if (recentSummon) {
                  core.info(`PR #${pr.number}: a summon for this head is already in flight — debounced`);
                  return;
                }
                const re = await ok(`PR #${pr.number} summon Greptile`, () =>
                  github.rest.issues.createComment({
                    ...base, issue_number: pr.number, body: `@greptileai review\n${summonMark}`,
                  }));
                if (re) core.info(`PR #${pr.number}: summoned Greptile (${why})`);
              };

              if (alreadyHandedOff) {
                // Handed off, but is Greptile actually COMING? If the post-label summon
                // failed (ok() swallows transient errors; the job can die between the
                // label and the comment), the label and marker persist and no later
                // sweep would re-summon — labeled-but-never-reviewed forever. A missing
                // live run for this head means the review never started.
                await summonGreptile('handed off with no live run');
                continue;
              }

              // ADVISORY note on what is NOT checked here any more: this used to also
              // require a Copilot review and a bounded Codex grace on the head. Both are
              // gone. The Codex summon provably never worked — an `@codex` mention
              // resolves against the COMMENTER, and this workflow comments as
              // `github-actions[bot]`, which has no Codex account (measured across
              // #1589: 7 mentions, 7 "not connected" replies; every real Codex review
              // followed a PUSH). And with Greptile advisory, sequencing it behind other
              // reviewers no longer protects a merge gate — only a bill.
              if (!(upToDate && unresolved === 0)) {
                core.info(`PR #${pr.number}: holding — upToDate=${upToDate} unresolved=${unresolved}`);
                continue;
              }

              // Head check LAST, immediately before acting. GitHub offers no
              // compare-and-swap, so the window between the final read and the write
              // cannot be eliminated, only narrowed. The residual is self-correcting:
              // the marker embeds this SHA, so if the head moved, the next sweep sees
              // labelledSha !== sha and strips the label rather than leaving a false
              // claim standing.
              const fresh = await ok(`PR #${pr.number} revalidate head`, () =>
                github.rest.pulls.get({ ...base, pull_number: pr.number }).then(r => r.data));
              if (!fresh || fresh.head.sha !== sha) {
                core.info(`PR #${pr.number}: head moved during the sweep — skipping this pass`);
                continue;
              }

              // Marker FIRST, then the label. If the label went on first and the comment
              // failed, the PR would sit inside Greptile's filter with no marker — and
              // the marker-less branch above would strip it again next run, flapping.
              const marker = await ok(`PR #${pr.number} marker`, () =>
                github.rest.issues.createComment({
                  ...base, issue_number: pr.number,
                  body: `Handing off to Greptile (advisory) — settled on \`${sha.slice(0, 8)}\`.\n${MARK}${sha} -->`,
                }));
              if (!marker) { core.warning(`PR #${pr.number}: marker failed — not labelling`); continue; }

              const applied = await ok(`PR #${pr.number} addLabel`, () =>
                github.rest.issues.addLabels({ ...base, issue_number: pr.number, labels: [LABEL] }));
              if (!applied) {
                core.warning(`PR #${pr.number}: marker posted but label failed — will retry next run`);
                continue;
              }
              core.notice(`PR #${pr.number}: settled — handing off to Greptile (advisory).`);
              // MEASURED on the pipeline's first autonomous run (#1575, 2026-07-27):
              // the label alone does NOT wake Greptile — 12 labeled minutes, no review.
              // The label admits the PR through the dashboard filter; the summon is what
              // starts the review. Not unconditional: after a strip-then-relabel cycle on
              // the SAME sha a run may already exist, and a fresh summon would bill a
              // re-review of an already-reviewed diff. summonGreptile() enforces that.
              await summonGreptile('fresh handoff');
            }
