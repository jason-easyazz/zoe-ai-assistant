name: Zoe CI dependencies
description: >-
  The ONE slim dependency install every pytest job in validate.yml uses (the required gate's shards,
  the checks job, the full-collection job and the informational zoe-data-py312 job). One copy, so the
  jobs cannot drift apart: tests/unit/test_ci_instrument_honesty.py pins that every lane job uses it.

inputs:
  python-version:
    description: Interpreter for this job (3.10 = the required gate, 3.12 = the informational live-interpreter lane).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # Slim install — avoids Jetson-specific packages (torch/onnx/whisper stacks)
    # that would timeout or fail on x86_64 GitHub runners.
    #
    # KEEP THE PINNED ENTRIES IN LOCKSTEP WITH services/zoe-data/requirements.txt —
    # EXCEPT a package recorded in STEP_UP_DIVERGENCE (tests/unit/
    # test_zoe_data_py312_cutover.py): there the pin follows requirements-py312.txt,
    # the LIVE lane, since the 3.10 manifest describes a rollback-only env
    # (uvicorn, ag-ui-protocol, livekit-protocol as of 2026-09-27).
    # The 3.12-ONLY step-ups (websockets 17, starlette 1.8, APScheduler 3.11.3 + tzlocal 5.4 + pytz, fastapi 0.143.1;
    # 2026-10-28) are deliberately NOT here: this list must install on Python 3.10 AND 3.12 (it is shared by the
    # zoe-data-py312 job). They are proven by the local full ci_safe run on a throwaway venv built from
    # requirements-py312.txt (PR body), not by this lane.
    # Anything left unpinned here resolves to the newest release at CI time, so
    # the lane silently tests a DIFFERENT version than production runs — which is
    # exactly how uvicorn/websockets drifted. The `deps-resolvable` job proves the
    # manifests themselves still resolve; this list only has to agree with them.
    # ONE deliberate exception: icalendar (calendar_ical.py, alembic 0052) is pinned here only. Nothing on the
    # request path imports it yet; it joins requirements.txt with the calendar connectors work (a manifest edit
    # is voice-gated, see voice_gate_check.VOICE_PATH_PATTERNS) - docs/architecture/calendar-data-model.md s7.
    - name: Install slim CI deps
      shell: bash
      run: |
        pip install --quiet \
          aiosqlite asyncpg psycopg2-binary alembic \
          fastapi "httpx>=0.27.0,<0.28" "apscheduler==3.10.4" "tzlocal>=2,<3" "sqlalchemy>=2.0,<3.0" \
          pydantic pywebpush py-vapid cryptography \
          "ag-ui-protocol==1.0.0" "websockets==16.1.1" "pyjwt==2.15.0" passlib \
          python-multipart "uvicorn[standard]==0.54.0" "prometheus-client==0.26.0" "python-json-logger>=4.1.0" \
          pyyaml "icalendar==7.3.0"

    - name: Install lane deps (zoe-auth, numpy, LiveKit wheels)
      shell: bash
      run: |
        pip install --quiet -r services/zoe-auth/requirements.txt
        # numpy: lets the ci_safe semantic_router/router-head tests actually run
        # in this slim lane (they fake the embedding model + head; no fastembed
        # or sklearn needed). Without it they importorskip -> silently skip.
        pip install --quiet "numpy<2"
        # LiveKit/WebRTC ingest deps. test_livekit_audio_frame_bytes.py
        # importorskips av/aiortc at module scope and the module it exercises
        # (livekit_aiortc) imports livekit.protocol at top level — without these
        # the whole ingest-fidelity suite SKIPS, pytest reports green, and the
        # required gate stops guarding the _AudioStream padding fix. All three
        # resolve to manylinux x86_64 wheels for cp310 with no source build.
        # Versions are pinned to what the Jetson actually runs (av 17.1.0 /
        # aiortc 1.15.0 since 2026-09-26).
        # test_livekit_ci_dep_guard.py FAILS the lane if they ever go missing,
        # so deleting this line cannot silently re-open the hole.
        pip install --quiet "av==17.1.0" "aiortc==1.15.0" "livekit-protocol==1.1.27"
