# Dependabot version updates — batched, rate-limited, rocks held.
#
# Why this shape: every PR costs review spend and, with branch protection
# `strict`, every merge pushes the other open PRs behind (AGENTS.md "Serialise").
# So: one grouped minor+patch PR per directory per week, majors as their own PRs
# (they need a human read), and at most 2 open PRs per directory.
#
# HELD dependencies are ignored outright — the rocks and what they are built on
# (docs/CANONICAL.md; tests/AGENTS.md on the numpy<2 / chromadb ceilings). A
# held pin moves only through a deliberate, replay-gated PR, never a bot bump.
#
# VOICE PATH: scripts/maintenance/voice_gate_check.py classifies the manifests
# of labs/flue-zoe-brain-2x (the LIVE brain lane) and services/zoe-core (the
# dormant fallback brain) as voice path, and deploy.yml rebuilds + restarts the
# brain sidecar whenever labs/flue-zoe-brain-2x/ changes. A bump there must be
# landed with the voice replay (scripts/maintenance/voice_regression_probe.py
# against the PR head) — a green `validate` is not enough.
# labs/flue-zoe-telegram-2x is a front-door channel, not voice path, but
# deploy.yml also rebuilds + restarts it on change: check the bot after merge.
#
# SECURITY updates are NOT configured here. This file drives VERSION updates
# only; whether Dependabot also opens PRs for security ALERTS is the repo setting
# "Dependabot security updates" (`gh api repos/<owner>/<repo>/automated-security-fixes`).
# (enabled 2026-11-10). Do NOT rely on the `ignore:` lists below to keep held
# pins out of those PRs: measured on the first batch, a security fix for a
# transitive dep bumped its IGNORED parent (#2376/#2377 moved pi-coding-agent to
# fix undici/minimatch), and a manifest with no entry here got a rock bump
# (#2374, torch 2.8 -> 2.13 in scripts/setup). Every security PR that touches a
# held pin or a voice-path manifest is closed and fixed by a deliberate PR.
#
# TRANSITIVE fixes under a held parent (@flue/*, @earendil-works/pi-*) go in the
# lab's package.json `overrides` — the parents pin exact versions, so the lock
# alone cannot move. A dependency inside a package that ships npm-shrinkwrap.json
# (pi-coding-agent does) CANNOT be overridden; it moves only with the parent.
#
# Every LIVE manifest must be listed below, or its drift is silent until an
# alert fires. Not listed on purpose: scripts/setup/requirements-kokoro.txt
# (every entry is a held voice pin and nothing is installed from it — it is the
# drift manifest for the system-site-packages Kokoro venv) and the panel-Pi
# manifests (services/omi-sync, services/panel-bluetooth: operator-installed on
# the Pi). Alerts (and security PRs) still fire for them; triage by hand.

version: 2
updates:
  - package-ecosystem: npm
    directory: /services/zoe-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pi is pinned in THREE places that must move together (zoe-core
      # package.json, modules/omnigent/Dockerfile, pi_runtime_probe —
      # tests/unit/test_harness_pin_agreement.py), and zoe_core_client.py is
      # written against its RPC event schema. A bot bump here can only be red.
      - dependency-name: "@earendil-works/pi-*"

  - package-ecosystem: npm
    directory: /labs/flue-zoe-brain-2x
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The LIVE brain (:3579). @flue/* moves only with a lab check: Flue 2.2.x
      # drags pi-ai 0.83 -> 0.87, which README.md pins against ("0.84+ changes
      # the provider stream contract"). Majors are a harness migration (1.x -> 2.x
      # was a program of its own). Land by hand: parity suite + LANDING.md + voice replay.
      - dependency-name: "@flue/*"
      # pi-ai is pinned exactly (0.83.0); same provider-stream-contract reason.
      - dependency-name: "@earendil-works/pi-*"
      # Types must match the Node the sidecar runs (22.x), not a newer major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /labs/flue-zoe-telegram-2x
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@flue/*"
        update-types: ["version-update:semver-major"]
      # Types must match the Node the sidecar runs (22.x), not a newer major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /services/zoe-data
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Held — see docs/CANONICAL.md. No update of any kind.
      - dependency-name: "chromadb"         # 0.6.3: the memory vector store's on-disk format
      - dependency-name: "moonshine-voice"  # STT rock (Moonshine v2 Medium)
      - dependency-name: "torch*"           # torch/torchaudio/torchvision: Jetson/CUDA wheels
      # numpy<2 is a C-ABI ceiling for chromadb + both voice rocks (tests/AGENTS.md).
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      # Deliberate pins (reasons in services/zoe-data/requirements*.txt). Dependabot
      # ignores by name across the whole directory, so these also stop the
      # requirements-py312.txt copies; each moves only through a deliberate PR.
      - dependency-name: "APScheduler"      # 3.10.4 in the 3.10 file; the py312 lane moved to 3.11.3 BY HAND on 2026-10-28 with pytz pinned explicitly (3.11 without pytz DELETES persisted pytz-trigger jobs) - never auto-bump
      - dependency-name: "websockets"       # 3.10 file holds 16.1.1 (17.x needs Python >=3.11, so it cannot resolve there: #2168); the py312 lane is on 17.2 by hand (17.x minor/patch bumps still flow through the normal 14-day review)
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytz"             # py312 lane held at 2026.3: APScheduler 3.11.3 breaks on pytz.FixedOffset from 2026.4 (fixed upstream, unreleased); explicit pin exists so persisted pytz-trigger jobs stay restorable
      - dependency-name: "onnxruntime"      # 1.23.2: last cp310 wheel; the 1.30+ step-up is a separate gated runbook move (voice VAD/embeddings)
      - dependency-name: "scikit-learn"     # held at the training pins while the ZOE_ROUTER_HEADS_BACKEND=joblib fallback can still unpickle .joblib heads
      - dependency-name: "joblib"           # same reason as scikit-learn
      - dependency-name: "uvicorn"          # 3.10 file capped at 0.49.0 (py312 file crossed to 0.53.0 then 0.54.0 deliberately, replay-gated); websocket path moves only with the voice replay
      - dependency-name: "SQLAlchemy"       # 2.1+ requires Python >=3.11, so it cannot resolve against the 3.10 requirements.txt (#2047/#2066 deps-resolvable); patch bumps within 2.0.x still flow
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "mempalace"        # moves with chromadb/B0.8 AND the pin in scripts/setup/jetson/install-jetson-agent.sh (tests/unit/test_jetson_agent_install_pins.py); a skewed side venv corrupts the palace
      - dependency-name: "transformers"     # voice_turn/semantic_router/embedding numerics: bump only through a replay-gated PR (requirements*.txt is invisible to the replay probe)
      - dependency-name: "fastembed"        # embedding model/numerics feed memory recall; replay-gated PR only (same probe blind spot)
      - dependency-name: "cloakbrowser"     # 0.x: a minor is a breaking change (browser_broker); move deliberately
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "scipy"            # 1.18+ needs numpy>=2 and Python>=3.12; the numpy<2 ceiling holds (chromadb + both voice rocks), so it cannot resolve (#2074); patches within 1.17.x still flow
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "livekit-protocol" # lane-specific on purpose: py312 lane 1.1.27, the 3.10 rollback manifest holds 1.1.8 (STEP_UP_DIVERGENCE in tests/unit/test_zoe_data_py312_cutover.py, #2074); move each lane by hand, never auto-bump the rollback pin
      # Lane-divergent: the py312 lane carries newer releases than the 3.10 rollback
      # manifest (STEP_UP_DIVERGENCE in tests/unit/test_zoe_data_py312_cutover.py, which
      # also fails if one of these names loses its ignore). Dependabot treats the two
      # files as one set, so an un-ignored bump would push requirements.txt to
      # versions needing Python >=3.11 (unresolvable) or DOWNGRADE the live lane.
      # These move only by hand, per lane. All update types, like livekit-protocol.
      - dependency-name: "fastapi"          # live lane 0.162.0 needs starlette 1.10 (>=3.11); rollback holds 0.143.0
      - dependency-name: "starlette"        # 1.8+ needs Python >=3.11; rollback pinned at 1.3.1 (#2391), live lane 1.10.0
      - dependency-name: "python-multipart" # 0.0.33 needs Python >=3.11; rollback holds 0.0.32
      - dependency-name: "aiortc"           # 1.16.0 needs Python >=3.11; rollback holds 1.15.0
      - dependency-name: "ag-ui-protocol"   # live lane is 1.0.0; proposing 0.1.x would DOWNGRADE it (rollback holds 0.1.19)

  # LIVE container (homeassistant-mcp-bridge). Every transitive dep is pinned
  # exactly (requirements.txt header), so a grouped weekly PR is the only way
  # they move. deploy.yml does NOT rebuild this image: after a merge, run
  # `docker compose build homeassistant-mcp-bridge && docker compose up -d
  # homeassistant-mcp-bridge` or the pin change never reaches the box.
  - package-ecosystem: pip
    directory: /services/homeassistant-mcp-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  # LIVE container (zoe-auth). deploy.yml rebuilds it when services/zoe-auth/
  # changes. fastapi + pydantic move together (requirements.txt header).
  - package-ecosystem: pip
    directory: /services/zoe-auth
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    # CI tests this manifest on Python 3.11, like the container (validate.yml's
    # `zoe-auth` job), so a >=3.11-only release is fine here. fastapi and
    # pydantic still move only by hand, with the audit in requirements.txt:
    # a security update still arrives for them.
    ignore:
      - dependency-name: "fastapi"
      - dependency-name: "pydantic"
