# Pre-commit hooks for the Zoe repo.
# Mirrors the repo's own mandated checks so cloned checkouts are protected the
# same way the local .git/hooks/pre-commit protects this host.
# Install with:  pre-commit install
minimum_pre_commit_version: "2.20.0"

repos:
  # Standard hygiene hooks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]

  # Zoe's own mandated structure validator (repo: local so it runs against the
  # checkout, no network fetch, no version pinning). NOTE: validate_critical_files
  # is intentionally NOT wired here — it hard-codes services/zoe-ui/dist/ artifact
  # paths that may be absent on a fresh clone / failed UI build, which would block
  # every local commit. It still runs in CI (validate.yml) where the full tree is
  # present.
  - repo: local
    hooks:
      - id: zoe-validate-structure
        name: Zoe project structure validation
        entry: python3 tools/audit/validate_structure.py
        language: system
        pass_filenames: false
        always_run: true
      # The committed flag inventory must match the generator's output — CI
      # enforces this (test_flag_inventory.py) and it went stale->red repeatedly
      # (three times on 2026-07-27 alone; #1619/#1633/#1671 on 2026-08-10), each
      # time because an env-flag edit shipped without a regen. Scoped to the
      # files whose edits can stale it, so ordinary commits pay nothing.
      - id: zoe-flag-inventory-fresh
        name: Flag inventory regenerated + restaged
        # AUTO-FIX, not check-and-fail: a hook that only fails moves the papercut
        # to commit time (author must regen + re-commit by hand). Instead we
        # regenerate and `git add` the result, so the commit itself carries the
        # fresh inventory and `validate`'s test_flag_inventory.py can never see a
        # stale one. Because the hook stages what it regenerates, pre-commit's
        # unstaged-diff check stays empty->empty and does NOT abort the commit.
        # -I ignores the 'Last generated:'/'timestamp:' date lines — the
        # generator rewrites them to today, so on a later calendar day a
        # no-real-change commit must NOT churn (restore the committed copy from
        # the index) rather than stage a date-only diff. CI's test is
        # date-insensitive the same way.
        entry: bash -c 'python3 tools/audit/flag_inventory.py >/dev/null && if git diff --quiet -I "Last generated:" -I "^timestamp:" -- docs/knowledge/flag-inventory.md docs/knowledge/flag-inventory.json; then git checkout -q -- docs/knowledge/flag-inventory.md docs/knowledge/flag-inventory.json; else git add -- docs/knowledge/flag-inventory.md docs/knowledge/flag-inventory.json; fi'
        language: system
        pass_filenames: false
        files: '(\.(py|env|ya?ml)$|\.env\.example$)'
