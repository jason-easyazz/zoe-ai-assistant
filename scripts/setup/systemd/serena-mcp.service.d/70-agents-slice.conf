# Re-parent the shared Serena under zoe-agents.slice, so the aggregate engineering bound
# actually includes the one process that leaks to ~1 GB roughly hourly. Without this it
# sits in app.slice and the slice's "fleet-wide bound" silently excludes it.
#
# Member caps are UNCHANGED: serena-mcp.service keeps its own MemoryHigh/MemoryMax=2G and
# the no-swap drop-in. A slice parent adds an aggregate; it relaxes nothing.
#
# A DROP-IN, never a template copy - the installed unit carries host edits and its own
# untracked drop-ins (no-swap.conf). Install (zoe-agents.slice FIRST, or systemd creates
# an implicit, UNCAPPED slice of the same name):
#   mkdir -p ~/.config/systemd/user/serena-mcp.service.d
#   cp scripts/setup/systemd/serena-mcp.service.d/70-agents-slice.conf ~/.config/systemd/user/serena-mcp.service.d/
#   systemctl --user daemon-reload && systemctl --user restart serena-mcp
# A restarted Serena can take MANY minutes to answer its first request (it walks every
# .gitignore under the checkout) - that is warm-up, not a fault; see setup/systemd/README.md.
# Verify:   cat /proc/$(systemctl --user show -p MainPID --value serena-mcp)/cgroup   # .../zoe-agents.slice/serena-mcp.service
# Rollback: rm the file, daemon-reload, restart.
[Service]
Slice=zoe-agents.slice
