# Tracked from the live host (found by unit_drift_check 2026-10-25): swap is FORBIDDEN for the shared
# Serena. Same lesson as the voice stack (#1409): MemoryMax without MemorySwapMax is not a cap -
# MemoryHigh pressure pushes the overflow to swap (observed 2026-07-20: 1.0G RSS + 2.1G swap = 3.1G
# real footprint under a "2G max"). Swap forbidden => MemoryMax=2G is the true bound; a breach
# OOM-kills it and Restart=always brings it back fresh (state is rebuildable cache).
#
# A DROP-IN, never a template copy. It overrides the unit's `MemorySwapMax=2G`; the unit keeps 2G so
# tests/unit/test_agent_mcp_memory_bounds.py (member cap stays on the unit) still holds. Already
# installed on the box under this same name, so there is nothing to apply there.
# Install elsewhere:
#   mkdir -p ~/.config/systemd/user/serena-mcp.service.d
#   cp scripts/setup/systemd/serena-mcp.service.d/no-swap.conf ~/.config/systemd/user/serena-mcp.service.d/
#   systemctl --user daemon-reload      # effective at the next restart; no restart is needed to adopt it
[Service]
MemorySwapMax=0
