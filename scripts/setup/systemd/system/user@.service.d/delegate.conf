# ROOT drop-in (operator only): delegate cgroup controllers to the user manager.
#
# zoe-agents.slice (and every other user-manager slice/unit) can only enforce a controller the
# user manager has been DELEGATED. Without `cpu` and `io` here, CPUWeight=/IOWeight= in the
# user slice are accepted and silently do nothing; MemoryMax/MemorySwapMax need `memory`.
# This host has exactly this file live at /etc/systemd/system/user@.service.d/delegate.conf; until
# 2026-10-04 it was UNTRACKED, so a rebuilt box would lose the weights without any error.
#
# Install (root):
#   sudo install -D -m 0644 scripts/setup/systemd/system/user@.service.d/delegate.conf \
#        /etc/systemd/system/user@.service.d/delegate.conf
#   sudo systemctl daemon-reload      # reaches the user manager at its next (re)start / re-login
# Verify (as the user, after the slice is installed):
#   cat /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers   # cpu io memory pids
#   cat .../zoe-agents.slice/cpu.weight                                                          # 50
# Rollback: sudo rm the file; sudo systemctl daemon-reload.
#
# NOTE: even with `io` delegated, io.weight only exists when the block layer supports it (BFQ or
# io.cost). On this Orin the NVMe scheduler is `none`, `io.weight` is ABSENT from every user
# cgroup, and IOWeight= is inert regardless of delegation (cpu.weight and memory.* are real).
[Service]
Delegate=pids memory cpu io
