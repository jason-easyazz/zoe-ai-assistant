# Run the Kokoro TTS sidecar on its dedicated venv (B5.7) instead of the bare
# system Python 3.10. A DROP-IN, never a template copy — the installed unit carries
# host edits and its own untracked drop-ins (backend.conf, memory.conf).
#
# The venv is the SAME interpreter and the SAME site-packages (built with
# --system-site-packages: torch 2.8.0 CUDA wheel, kokoro, misaki, transformers all
# unchanged) plus an import blocker that keeps scikit-learn / pandas / pyarrow out
# of the process — transformers imported them only because they are installed.
# Measured effect and the A/B table: docs/knowledge/voice-pipeline.md
# (Kokoro dedicated venv).
#
# Precondition: the venv exists and passes its own check —
#   bash scripts/setup/build_kokoro_venv.sh && bash scripts/setup/build_kokoro_venv.sh --check
# Without it the ExecStart binary is missing and Restart=always loops (voice falls
# back to Edge/espeak TTS); rollback below.
#
# Install (brain-window lock held, MemAvailable >= 2 GB, no deploy.yml run):
#   mkdir -p ~/.config/systemd/user/kokoro-tts.service.d
#   cp scripts/setup/systemd/kokoro-tts.service.d/60-kokoro-venv.conf ~/.config/systemd/user/kokoro-tts.service.d/
#   systemctl --user daemon-reload && systemctl --user restart kokoro-tts
#   # poll :10201/health until pipeline_loaded=true and device=cuda
# Verify the blocker in the live process (expect no output):
#   grep -E '/(sklearn|pandas|pyarrow)/' /proc/$(systemctl --user show -p MainPID --value kokoro-tts)/maps
# Rollback (nothing was uninstalled — the system interpreter still has everything):
#   rm ~/.config/systemd/user/kokoro-tts.service.d/60-kokoro-venv.conf
#   systemctl --user daemon-reload && systemctl --user restart kokoro-tts
#
# Only the interpreter changes: WorkingDirectory, LD_LIBRARY_PATH, the memory
# guards, MALLOC_* (40-memory-tuning.conf) and every other drop-in still apply.
[Service]
# Empty ExecStart= FIRST: for Type=simple systemd APPENDS ExecStart lines, and two
# of them is a unit-load error. The reset clears the template's line.
ExecStart=
ExecStart=%h/.zoe/venvs/kokoro-py310/bin/python %h/assistant/scripts/setup/kokoro_sidecar.py
