# Cap glibc malloc arenas on the Kokoro TTS sidecar (B6.6). Allocator-only:
# the model, weights and numerics are untouched.
#
# Measured 2026-09-27 on the live Orin (pid 797734, 36 threads, no MALLOC_* in
# its environ): VmRSS 2,140 MB, cgroup memory.current 2,106 MB, anon 1,431 MB,
# ~1.04-1.09 GB of it in 26 arena-shaped 64 MB anon regions (the default arena
# cap is 8 x nproc). Inference is serialised by _pipeline_lock, so two arenas do
# not contend.
#
# RESULT (controlled same-age A/B, 2026-09-27): -113 to -125 MB anon, VmRSS
# -73 to -112 MB, synth p50/p95 within noise. That is far below the -400..-800 MB
# the arena count suggested: the arena-shaped regions went from 17 (843 MB) to
# 10 (340 MB), but most of their content was live data that simply moved.
# Table: docs/knowledge/voice-pipeline.md (Kokoro sidecar memory).
#
# Same fix, same values as zoe-data's live 40-memory-tuning drop-in (3.2 GB ->
# 365 MB there). The lower trim threshold returns freed chunks to the OS sooner.
#
# A DROP-IN, never a template copy — the installed unit carries host edits and
# its own untracked drop-ins (backend.conf, memory.conf). Install:
#   mkdir -p ~/.config/systemd/user/kokoro-tts.service.d
#   cp scripts/setup/systemd/kokoro-tts.service.d/40-memory-tuning.conf ~/.config/systemd/user/kokoro-tts.service.d/
#   systemctl --user daemon-reload && systemctl --user restart kokoro-tts   # poll :10201/health
# Verify: tr '\0' '\n' < /proc/$(systemctl --user show -p MainPID --value kokoro-tts)/environ | grep MALLOC
# Rollback: rm the file, daemon-reload, restart.
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
