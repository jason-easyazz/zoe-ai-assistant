# Kokoro start timeout above its own wait for the brain.
# kokoro_sidecar.py blocks its CUDA load until the brain's /health answers (up to
# ZOE_KOKORO_BRAIN_WAIT_S, default 180 s), then loads + warms (~14 s). The installed unit's
# TimeoutStartSec=120 lets systemd SIGTERM it mid-wait on a slow-brain boot and loop; the
# template already says 300 but the installed unit never got it (unit_drift_check.py,
# docs/knowledge/log-review-units-2026-10-04.md; apply: incident-runbook section 24(b)).
# A DROP-IN, never a template copy (the installed unit carries host edits):
#   mkdir -p ~/.config/systemd/user/kokoro-tts.service.d
#   cp scripts/setup/systemd/kokoro-tts.service.d/70-start-timeout.conf ~/.config/systemd/user/kokoro-tts.service.d/
#   systemctl --user daemon-reload      # applies on the NEXT start; do not bounce TTS for this
# Verify: systemctl --user show kokoro-tts -p TimeoutStartUSec   # 5min.  Rollback: rm + daemon-reload.
[Service]
TimeoutStartSec=300
