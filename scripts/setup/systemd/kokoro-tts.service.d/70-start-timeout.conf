# Give Kokoro a start timeout longer than its own wait for the brain.
#
# kokoro_sidecar.py blocks its CUDA load until the brain's /health answers, for up
# to ZOE_KOKORO_BRAIN_WAIT_S (default 180 s), THEN loads ~2.3 GB and warms up
# (~14 s). With the installed unit's TimeoutStartSec=120 a boot where the brain is
# slow to mlock makes systemd SIGTERM Kokoro at 120 s, Restart=always starts it
# again 10 s later, and it can loop without ever reaching the load. The template
# already says 300 (above the 180 s wait + load); the INSTALLED unit never got it —
# found by scripts/maintenance/unit_drift_check.py in the 2026-10-04 log review
# (docs/knowledge/log-review-units-2026-10-04.md; apply: incident-runbook section 24).
#
# A DROP-IN, never a template copy — the installed unit carries host edits and its
# own untracked drop-ins (backend.conf, memory.conf). Install:
#   mkdir -p ~/.config/systemd/user/kokoro-tts.service.d
#   cp scripts/setup/systemd/kokoro-tts.service.d/70-start-timeout.conf ~/.config/systemd/user/kokoro-tts.service.d/
#   systemctl --user daemon-reload     # takes effect on the NEXT start; no restart needed now
# Verify: systemctl --user show kokoro-tts -p TimeoutStartUSec    # -> 5min
# Rollback: rm the file, daemon-reload.
[Service]
TimeoutStartSec=300
