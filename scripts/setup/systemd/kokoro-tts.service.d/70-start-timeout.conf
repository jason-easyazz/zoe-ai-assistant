# Template consistency ONLY -- NO runtime effect. Installed unit: TimeoutStartSec=120, template:
# 300 (unit_drift_check.py reports it). Kokoro is Type=simple with no ExecStartPre/Post, so systemd
# counts it started at exec and the timeout never runs during the sidecar's up-to-180 s brain wait
# or model load (the template says so; llama-server differs because its ExecStartPost health probe
# makes the timeout bite). Optional: runbook section 24(b); `daemon-reload`, no restart.
[Service]
TimeoutStartSec=300
