# Make the 4B brain's cold start survive Tegra NvMap page-cache pressure (open-problems 2026-10-10 "Brain restart" / "Brain").
#
# After a stop (night window, deploy, OOM recovery) the start failed for 14.5 min with `NvMapMemAllocInternalTagged error 12` /
# `cudaMalloc 2493 MiB failed` at ~6 GB MemAvailable: NvMap does not reclaim page cache, and loading the GGUF fills the cache faster than the big
# weight buffer lands. One drop_caches before the start was not enough; dropping every ~0.3 s WHILE it loaded was.
#
# brain_cold_start.sh drops the cache once, then starts a bounded loop (180 s, stops when :11434/health answers) as ITS OWN TRANSIENT UNIT
# (`systemd-run --user --no-block`; systemd kills every process an ExecStartPre= forked before ExecStart runs, so a child of this step would not
# survive into the load) and exits 0 at once. The `-` means
# it can never fail the unit: no passwordless sudo = one log line and the start proceeds exactly as before. The unit's ExecStart is NOT touched.
# `ExecStartPre=` first resets the list (the template has none today; the reset keeps this idempotent if one is ever added).
#
# RestartSec=10 is the template's value, stated here on purpose: the detached loop keeps dropping the cache across the restart gap and each retry's
# Pre step supersedes it with a fresh 180 s loop, so a retry meets a clean cache without a longer wait; a host-local drop-in with a shorter value
# (which would start the retry before the loop has run) is overridden. It also keeps `unit_drift_check.py` quiet: it reports no differs/missing
# finding for this drop-in (the extra ExecStartPre is a `live_only` note, shown only with --strict).
#
# This file is NOT the template (the template llama-server.service is voice-path scope: touching it needs a replay-gated landing). A DROP-IN, never a
# template copy -- the installed unit carries host edits and its own untracked drop-ins (memory.conf, priority.conf, ...).
# Needs: the repo checkout at ~/assistant (the script path below) and passwordless `sudo -n` for `sh -c 'echo 1 > /proc/sys/vm/drop_caches'`.
# Install (no restart needed to install; it takes effect on the NEXT start; do the verify below in a quiet brain window):
#   mkdir -p ~/.config/systemd/user/llama-server.service.d
#   cp scripts/setup/systemd/llama-server.service.d/50-cold-start.conf ~/.config/systemd/user/llama-server.service.d/
#   systemctl --user daemon-reload
# Verify: docs/knowledge/brain-cold-start.md (a cold `systemctl --user restart llama-server` with a full page cache comes up first try;
#   `journalctl --user -t brain-cold-start --since "-10min"` shows the loop start and its stop).
# Rollback: rm ~/.config/systemd/user/llama-server.service.d/50-cold-start.conf && systemctl --user daemon-reload
[Service]
ExecStartPre=
ExecStartPre=-/bin/bash %h/assistant/scripts/maintenance/brain_cold_start.sh
RestartSec=10
