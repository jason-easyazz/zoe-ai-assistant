# Treat the Node sidecar's SIGTERM exit (143) as a clean stop (same line as the flue-zoe-brain-2x.service
# template; this drop-in reaches an INSTALLED unit without a template copy). Without it every
# stop/deploy logs "Failed with result 'exit-code'" (29+ false failures in a week). Restart=always
# is unchanged. Apply: runbook section 24(c): copy to ~/.config/systemd/user/flue-zoe-brain-2x.service.d/,
# `systemctl --user daemon-reload` (no restart). Verify: show flue-zoe-brain-2x -p SuccessExitStatus -> 143.
[Service]
SuccessExitStatus=143
