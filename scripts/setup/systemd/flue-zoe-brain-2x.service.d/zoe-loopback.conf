# Bind the live brain (:3579) to loopback only (security fix 2026-10-19). Flue 2.1.1's generated entry passes no hostname,
# so Node listened on every interface and the brain answered the whole LAN; nothing off the box calls it (zoe-data uses
# http://127.0.0.1:3579). scripts/lib/node_listen_host.mjs rewrites the TCP listen to ZOE_LISTEN_HOST.
# The file name sorts AFTER every other drop-in on purpose: NODE_OPTIONS is one variable, and the last drop-in that sets
# it wins - keep any other NODE_OPTIONS flag the unit needs in THIS line.
# OWNER STEP (restarts the live brain - do it in a quiet window, then the replay gate):
#   cp scripts/setup/systemd/flue-zoe-brain-2x.service.d/zoe-loopback.conf ~/.config/systemd/user/flue-zoe-brain-2x.service.d/
#   systemctl --user daemon-reload && systemctl --user restart flue-zoe-brain-2x
#   ss -ltn 'sport = :3579'   -> 127.0.0.1:3579 only;   curl -sf http://127.0.0.1:3579/health
# Rollback: rm that file, daemon-reload, restart.
[Service]
Environment=ZOE_LISTEN_HOST=127.0.0.1
Environment=NODE_OPTIONS=--import=%h/assistant/scripts/lib/node_listen_host.mjs
