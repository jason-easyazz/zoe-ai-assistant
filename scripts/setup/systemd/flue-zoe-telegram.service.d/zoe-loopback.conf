# Bind the Telegram bot's HTTP side (:3582, /internal/notify) to loopback only (security fix 2026-10-19). Flue 2.1.1's
# generated entry passes no hostname, so it answered the whole LAN; the bot long-polls Telegram (outbound) and zoe-data
# reaches /internal/notify on http://127.0.0.1:3582. scripts/lib/node_listen_host.mjs rewrites the TCP listen.
# NODE_OPTIONS is ONE variable and the last drop-in that sets it wins; this file sorts after `happy-eyeballs.conf`, so it
# CARRIES that flag too (the Happy-Eyeballs fix the template sets: docs/knowledge/log-review-units-2026-10-04.md).
# OWNER STEP: cp to ~/.config/systemd/user/flue-zoe-telegram.service.d/, daemon-reload, restart flue-zoe-telegram;
#   ss -ltn 'sport = :3582' -> 127.0.0.1:3582 only;  curl -sf http://127.0.0.1:3582/health.  Rollback: rm, reload, restart.
[Service]
Environment=ZOE_LISTEN_HOST=127.0.0.1
Environment=NODE_OPTIONS=--network-family-autoselection-attempt-timeout=1500 --import=%h/assistant/scripts/lib/node_listen_host.mjs
