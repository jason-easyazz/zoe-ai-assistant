# Treat the Node sidecar's SIGTERM exit (code 143) as a clean stop.
#
# The Flue server traps SIGTERM and exits 143 (128+15). systemd counts only 0 as
# success, so every stop/restart (every deploy) logs "Main process exited,
# code=exited, status=143/n/a" + "Failed with result 'exit-code'" and flips the unit
# to failed for an instant — at least 29 false failures on the two Flue units
# 2026-09-27 -> 2026-10-04, burying any real crash (a non-143 exit). Restart=always
# is unchanged. The same line is in the flue-zoe-telegram.service template; this
# drop-in is how it reaches an INSTALLED unit without copying the template over host
# edits (the installed unit already carries flue2.conf / happy-eyeballs.conf /
# memory.conf). (docs/knowledge/log-review-units-2026-10-04.md; apply:
# incident-runbook section 24.)
#
#   mkdir -p ~/.config/systemd/user/flue-zoe-telegram.service.d
#   cp scripts/setup/systemd/flue-zoe-telegram.service.d/50-exit-143.conf ~/.config/systemd/user/flue-zoe-telegram.service.d/
#   systemctl --user daemon-reload     # no restart needed; applies to the next stop
# Verify: systemctl --user show flue-zoe-telegram -p SuccessExitStatus    # -> 143
# Rollback: rm the file, daemon-reload.
[Service]
SuccessExitStatus=143
