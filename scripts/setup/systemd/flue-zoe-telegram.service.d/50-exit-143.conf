# Treat the Node sidecar's SIGTERM exit (code 143) as a clean stop (same line as the
# flue-zoe-telegram.service template; this drop-in reaches an INSTALLED unit without a template copy).
# Without it every stop/deploy restart logs "Failed with result 'exit-code'" -- 29+ false
# failures in a week -- burying a real crash. Restart=always is unchanged.
# docs/knowledge/log-review-units-2026-10-04.md; apply: incident-runbook section 24(c).
#   mkdir -p ~/.config/systemd/user/flue-zoe-telegram.service.d
#   cp scripts/setup/systemd/flue-zoe-telegram.service.d/50-exit-143.conf ~/.config/systemd/user/flue-zoe-telegram.service.d/
#   systemctl --user daemon-reload      # no restart; applies to the next stop
# Verify: systemctl --user show flue-zoe-telegram -p SuccessExitStatus   # 143.  Rollback: rm + daemon-reload.
[Service]
SuccessExitStatus=143
