# B0.7 cutover — run zoe-data on the uv-built Python 3.12 venv instead of the
# EOL system Python 3.10. A DROP-IN, never a template copy: the installed unit
# carries host-specific edits and five untracked drop-ins that a `cp` of
# ../zoe-data.service would clobber (see scripts/setup/systemd/README.md).
#
# Runbook (apply order, gates, rollback):
#   docs/knowledge/python-312-venv-migration.md  §4 + §8
#
# Precondition: the venv exists and passes its own check —
#   bash scripts/setup/build_py312_venv.sh && bash scripts/setup/build_py312_venv.sh --check
# Without it the service fails to start (ExecStart binary missing) and
# Restart=always loops; rollback below.
#
# Install:
#   mkdir -p ~/.config/systemd/user/zoe-data.service.d
#   cp scripts/setup/systemd/zoe-data.service.d/60-py312-venv.conf ~/.config/systemd/user/zoe-data.service.d/
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /readyz
# Rollback (the 3.10 site-packages was never touched):
#   rm ~/.config/systemd/user/zoe-data.service.d/60-py312-venv.conf
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /readyz
#
# Only the interpreter changes. WorkingDirectory, EnvironmentFile=, LD_LIBRARY_PATH,
# MemorySwapMax/MemoryLow, CPU/IO weights and every other drop-in still apply.
# PATH / PYTHONPATH are deliberately NOT set: the app resolves its imports from
# WorkingDirectory (sys.path[0] under `-m`) exactly as on 3.10, and the only
# PATH-resolved `python3` it spawns is the engineering pipeline's pytest runner
# for agent worktrees (pipeline_focused_tests.py), which must keep the system
# interpreter — the venv ships no pytest.
#
# `deploy.yml` reads the interpreter back from `systemctl --user show -p ExecStart`
# (scripts/deploy/zoe_data_python.sh), so once this drop-in is loaded, deploys
# install deps into the venv and run Alembic with it; delete it and they follow
# the service back to 3.10. Nothing else needs flipping.
[Service]
# Empty ExecStart= FIRST: for Type=simple systemd APPENDS ExecStart lines, and
# two of them is a unit-load error. The reset clears the template's line.
ExecStart=
ExecStart=%h/.zoe/venvs/zoe-data-py312/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000
