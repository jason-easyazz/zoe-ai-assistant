# Take the distro library directory OUT of zoe-data's LD_LIBRARY_PATH (2026-10-12). A DROP-IN, never a template copy: the installed unit
# carries host edits and untracked drop-ins that a `cp` of ../zoe-data.service would clobber (see scripts/setup/systemd/README.md).
#
# Why. The unit's LD_LIBRARY_PATH ended in /usr/lib/aarch64-linux-gnu. That directory is on the linker's DEFAULT search path anyway, so
# listing it changes only the ORDER: the system libopenblas/libblas (Ubuntu 22.04, no bf16 `sbgemm_`) were preferred over the BLAS bundled
# in the torch wheel, and in the py312 venv `import torch` died with
#   ImportError: .../torch/lib/libtorch_cpu.so: undefined symbol: sbgemm_
# resemblyzer imports torch, so EVERY POST /api/voice/enroll (and the server-side /api/voice/identify fallback) returned 503 "resemblyzer
# not available" while `import resemblyzer` worked from any shell or transient unit that did not carry this variable (the owner's failed
# enrolment, 2026-10-12 19:11). Reproduced by running the venv python with the live process's environment (/proc/<pid>/environ):
# fails with it, works without LD_LIBRARY_PATH, works with only this one entry removed.
#
# zoe-data also carries a code-side fallback now (voice_speaker_id._embed_in_clean_subprocess: a child interpreter with the system
# directories filtered out), so enrolment works once the CODE is deployed even before this drop-in is applied; this drop-in removes the
# cause and the ~6 s child start per request.
#
# Install (deploy window; zoe-data restarts in ~2 s - mind the voice-gate 2 GB headroom rule):
#   cp scripts/setup/systemd/zoe-data.service.d/70-ld-library-path.conf ~/.config/systemd/user/zoe-data.service.d/
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /readyz
# Verify (no value printed; expect `torch ok`):
#   tr '\0' '\n' < /proc/$(systemctl --user show -p MainPID --value zoe-data)/environ | grep -c '^LD_LIBRARY_PATH=.*aarch64-linux-gnu'   # 0
# Rollback:
#   rm ~/.config/systemd/user/zoe-data.service.d/70-ld-library-path.conf
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /readyz
[Service]
Environment=LD_LIBRARY_PATH=%h/.local/lib:/usr/local/cuda-12.6/lib64
