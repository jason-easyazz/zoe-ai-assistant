# Where zoe-data's stdout/stderr go. ALREADY INSTALLED on the live box (it was an
# untracked host drop-in until the 2026-10-04 log review); tracked here so a
# rebuilt or second host converges instead of losing the capture silently.
# A DROP-IN, never a template copy (see scripts/setup/systemd/README.md).
#
# `append:` NEVER rotates and the host has no logrotate, so these two files grow
# without bound unless something rotates them: install the user timer
# zoe-log-rotate.timer (scripts/maintenance/rotate_service_logs.py), which
# replaces the older untracked ~/bin/zoe-logs-rotate.sh timer. What lands
# here, and why it was 119 MB / 86 MB in a day, is in
# docs/knowledge/log-review-2026-10-04.md:
#   stderr  JSON root-logger stream (middleware/logging.py setup_json_logging) +
#           uvicorn lifecycle + library/native warnings
#   stdout  uvicorn access log + the ExecStartPre sync_zoe_self.sh output
# The app log (zoe-data.app.log) is separate and rotates itself (logging_setup.py).
#
# Install (only on a host that lacks it; a deploy window, zoe-data restarts ~2 s):
#   mkdir -p ~/.config/systemd/user/zoe-data.service.d ~/.zoe-logs
#   cp scripts/setup/systemd/zoe-data.service.d/20-capture-output.conf ~/.config/systemd/user/zoe-data.service.d/
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /health
# Rollback:
#   rm ~/.config/systemd/user/zoe-data.service.d/20-capture-output.conf
#   systemctl --user daemon-reload && systemctl --user restart zoe-data
[Service]
StandardOutput=append:%h/.zoe-logs/zoe-data.stdout.log
StandardError=append:%h/.zoe-logs/zoe-data.stderr.log
