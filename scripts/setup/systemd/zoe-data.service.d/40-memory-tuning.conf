# Tracked from the live host (found by unit_drift_check 2026-10-25): cap glibc malloc arenas on zoe-data.
# Allocator-only - no model or numeric change. Cut arena bloat (3.2 GB -> ~365 MB at the time; the
# steady ~1.1 GB now is Moonshine in-process, not arenas). The lower trim threshold returns freed
# chunks to the OS sooner. Same values as kokoro-tts.service.d/40-memory-tuning.conf.
#
# A DROP-IN, never a template copy (the installed unit carries host edits and untracked drop-ins).
# Already installed on the box under this same name, so there is nothing to apply there.
# Install elsewhere:
#   mkdir -p ~/.config/systemd/user/zoe-data.service.d
#   cp scripts/setup/systemd/zoe-data.service.d/40-memory-tuning.conf ~/.config/systemd/user/zoe-data.service.d/
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /readyz
# Verify: tr '\0' '\n' < /proc/$(systemctl --user show -p MainPID --value zoe-data)/environ | grep MALLOC
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
