# A10 (infra audit 2026-10-03, D10) — raise zoe-data's open-files limit from the
# user manager's soft default of 1024 to 65536. A DROP-IN, never a template copy:
# the installed unit carries host edits and untracked drop-ins that a `cp` of
# ../zoe-data.service would clobber (see scripts/setup/systemd/README.md).
# Rationale and evidence: the LimitNOFILE comment in ../zoe-data.service.
#
# Install (deploy window; zoe-data restarts in ~2 s):
#   mkdir -p ~/.config/systemd/user/zoe-data.service.d
#   cp scripts/setup/systemd/zoe-data.service.d/30-nofile.conf ~/.config/systemd/user/zoe-data.service.d/
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /readyz
# Verify:
#   grep 'open files' /proc/$(systemctl --user show -p MainPID --value zoe-data)/limits   # 65536 65536
# Rollback:
#   rm ~/.config/systemd/user/zoe-data.service.d/30-nofile.conf
#   systemctl --user daemon-reload && systemctl --user restart zoe-data   # then poll /readyz
[Service]
LimitNOFILE=65536
