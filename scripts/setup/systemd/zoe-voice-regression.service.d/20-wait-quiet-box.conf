# The 04:30 voice regression waits for a QUIET box before it measures speed (2026-10-27).
#
# Why: zoe-voice-regression.timer fired at 04:30, fifteen minutes after zoe-serena-pregate-restart (04:15). A restarted shared Serena walks every .gitignore
# under the repo - ~300 .claude/worktrees checkouts included, which neither its `ignored_paths` nor the root .gitignore prune - for about 40 minutes
# (journalctl --user -u serena-mcp: 04:15 to 04:55), then initialises its language server. That is CPU + disk-metadata load right where the probe times
# Moonshine. Measured 2026-10-15..27: STT median 848 ms at 04:xx and 847 ms at 05:xx against 520-570 ms at every other hour, 8 of 11 04:30 runs red on
# speed only (STT > 1.5x the 551 ms baseline). The threshold stays 1.5x: widening it would hide a real STT regression along with the contention.
#
# What: an ExecStartPre (ignore-failure `-`: a missing helper must never stop the gate) runs scripts/maintenance/wait_for_quiet_box.py, which waits - bounded
# at 45 minutes - for three quiet samples in a row (system CPU busy <= 20% incl. iowait, Serena's process tree <= 0.15 core, load1 <= 3.0), logs why it is
# waiting, and on timeout proceeds anyway and says so. It runs AFTER the template's own ExecStartPre lines (mkdir, wait_for_port postgres) because a
# drop-in's ExecStartPre= is appended. TimeoutStartSec covers ALL ExecStartPre + ExecStart, so it is raised from the template's 1800 to 45 min wait + 5 min
# postgres + 30 min replay + slack.
#
# No --not-after clock cap (2026-10-28 review): a 04:50 cap ended the wait while Serena's ~40 min walk (04:15-04:55) was still running, so the
# replay measured a busy box again. The artifact-overwrite risk is covered instead by the operator-local landing gate
# (~/.zoe/agent-tools/night_busy.sh voice, owner tooling, not tracked): it reports busy while THIS unit is activating or active, so no lander
# probes or deploys while the nightly replay is waiting or running, however late it starts. The wait itself stays bounded by --max-wait-s.
#
# A DROP-IN, never a template copy: the template is voice-path scope (scripts/maintenance/voice_gate_check.py VOICE_PATH_PATTERNS), and the installed unit is a copy.
# Install (owner step; takes effect on the next fire, no restart needed):
#   mkdir -p ~/.config/systemd/user/zoe-voice-regression.service.d
#   cp scripts/setup/systemd/zoe-voice-regression.service.d/20-wait-quiet-box.conf ~/.config/systemd/user/zoe-voice-regression.service.d/
#   systemctl --user daemon-reload
# Verify: `systemctl --user cat zoe-voice-regression.service` lists the drop-in; the next 04:30 run's log (~/.zoe-logs/voice-regression.log) has a
# `wait_for_quiet_box:` line before the replay, and its STT median is back near 550 ms.
# Rollback: delete the drop-in file and daemon-reload.
[Service]
TimeoutStartSec=5400
ExecStartPre=-/usr/bin/python3 %h/assistant/scripts/maintenance/wait_for_quiet_box.py --max-wait-s 2700
