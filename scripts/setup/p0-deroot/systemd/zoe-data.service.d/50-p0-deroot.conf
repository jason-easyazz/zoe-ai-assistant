# P0-4 identity + sandbox for the SYSTEM copy of zoe-data.service (docs/architecture/p0-deroot.md). NOT applied by
# anything. Goes to /etc/systemd/system/zoe-data.service.d/ next to the ported unit, which keeps its own
# ExecStart, MemorySwapMax=0 / MemoryLow and every other drop-in. Proven in labs/p0-deroot (cells S*).
# HOME stays /home/zoe, so every `~/` and hard-coded /home/zoe path in zoe-data resolves inside this view of /home:
# the real /home is hidden (ProtectHome=tmpfs) and only the paths bound below exist. No bind SOURCE is under
# /home/zoe: a root-run mount must never follow a path an LLM-exposed uid can rename.
[Service]
User=zoe-svc
Group=zoe-svc
SupplementaryGroups=zoe-dockerproxy video render
Environment=HOME=/home/zoe DOCKER_HOST=unix:///run/zoe-docker-proxy/docker.sock
EnvironmentFile=
EnvironmentFile=/etc/zoe/env/zoe-data.env
StateDirectory=zoe-svc
LogsDirectory=zoe-data
# Override the live 20-capture-output.conf: systemd opens append: targets BEFORE it builds the namespace, so a
# /home/zoe/.zoe-logs path fails with "Failed at step STDOUT" (measured in labs/p0-deroot, 2026-10-18).
StandardOutput=append:/var/log/zoe-data/zoe-data.stdout.log
StandardError=append:/var/log/zoe-data/zoe-data.stderr.log
ProtectHome=tmpfs
BindReadOnlyPaths=/srv/zoe/assistant:/home/zoe/assistant /srv/zoe/models:/home/zoe/models /srv/zoe/venvs:/home/zoe/.zoe/venvs
BindPaths=/var/lib/zoe-svc/dot-zoe:/home/zoe/.zoe /var/lib/zoe-svc/voice-samples:/home/zoe/.zoe-voice-samples /var/lib/zoe-svc/mempalace:/home/zoe/.mempalace /var/log/zoe-data:/home/zoe/.zoe-logs
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
UMask=0027
