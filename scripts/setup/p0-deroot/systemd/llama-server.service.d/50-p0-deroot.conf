# P0-4 identity + sandbox for the SYSTEM copy of llama-server.service (docs/architecture/p0-deroot.md). NOT applied
# by anything. kokoro-tts.service and functiongemma-router.service take the same file with their own paths.
# The model tier holds NO secrets: no EnvironmentFile, no Docker, no sudo. It needs the Jetson GPU, whose nodes
# (/dev/nvmap, /dev/nvhost-*, /dev/nvgpu/igpu0/*) are root:video 0660, so: group video, and NO PrivateDevices /
# DevicePolicy (either would hide them). The ported unit keeps ExecStart, LimitMEMLOCK=infinity, MemorySwapMax=0
# and MemoryLow=6G (no MemoryMax, on purpose). Phase P0-4 step 1 is a CUDA smoke as zoe-model BEFORE this is used.
[Service]
User=zoe-model
Group=zoe-model
SupplementaryGroups=video render
Environment=HOME=/home/zoe
ProtectHome=tmpfs
BindReadOnlyPaths=/srv/zoe/models:/home/zoe/models /srv/zoe/llama.cpp-b11194:/home/zoe/llama.cpp-b11194
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
UMask=0027
