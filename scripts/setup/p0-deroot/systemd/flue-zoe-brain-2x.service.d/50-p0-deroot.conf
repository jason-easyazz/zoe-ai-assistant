# P0-4 identity + sandbox for the SYSTEM copy of flue-zoe-brain-2x.service (docs/architecture/p0-deroot.md). NOT
# applied by anything. flue-zoe-telegram.service takes the same file with its own lab dir, port and env file.
# The ported unit keeps ExecStart (node from /home/zoe/.nvm/current, bound read-only from /srv/zoe/node) and
# MemorySwapMax=0 / MemoryLow=512M / MemoryMax=2G. The schema-v8 store (labs/flue-zoe-brain-2x/data) is the only
# writable path; the rest of the checkout is read-only. No Docker, no GPU, no sudo.
[Service]
User=zoe-flue
Group=zoe-flue
SupplementaryGroups=
Environment=HOME=/home/zoe
EnvironmentFile=
EnvironmentFile=/etc/zoe/env/flue-zoe-brain-2x.env
StateDirectory=zoe-flue/brain-2x
ProtectHome=tmpfs
BindReadOnlyPaths=/srv/zoe/assistant:/home/zoe/assistant /srv/zoe/node:/home/zoe/.nvm/current
BindPaths=/var/lib/zoe-flue/brain-2x:/home/zoe/assistant/labs/flue-zoe-brain-2x/data
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
UMask=0027
