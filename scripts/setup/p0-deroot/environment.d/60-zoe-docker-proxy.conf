# P0-1 (docs/architecture/p0-deroot.md section 5): point every Docker client of the `zoe` user manager (zoe-data,
# the backup / health / idle-reap / heartbeat timers) at the allowlisted proxy instead of the raw daemon socket.
# NOT installed by anything. Owner step, AFTER P0-0 (the proxy is running and `zoe` is in group zoe-dockerproxy):
#   install -m 0644 60-zoe-docker-proxy.conf ~/.config/environment.d/
#   systemctl --user daemon-reload   (environment generators re-run on reload; check with
#   `systemctl --user show-environment | grep -c DOCKER_HOST`), then restart zoe-data (one voice-stack restart,
#   replay-gated) and let the timers pick it up on their next run
# Rollback: delete the file, daemon-reload, restart zoe-data. The docker CLI reads DOCKER_HOST itself; with the file
# absent it uses /var/run/docker.sock exactly as today. Shells and the runner's .env take the same line.
DOCKER_HOST=unix:///run/zoe-docker-proxy/docker.sock
