# P0-4 (docs/architecture/p0-deroot.md). NOT installed by anything: /etc/tmpfiles.d/zoe-p0-deroot.conf, then
# `sudo systemd-tmpfiles --create /etc/tmpfiles.d/zoe-p0-deroot.conf`. zoe-data's append: log files are opened by
# systemd BEFORE LogsDirectory= is created, so the directory must exist first (labs/p0-deroot cell S13 failed with
# "Failed at step STDOUT" until it did).
d /var/log/zoe-data 0750 zoe-svc zoe-svc -
