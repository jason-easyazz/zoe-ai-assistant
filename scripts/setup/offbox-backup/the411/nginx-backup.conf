# the411 host nginx: backup.the411.life -> the loopback rest-server (compose.yaml). NOT DEPLOYED by this repo.
# Install: /etc/nginx/sites-available/backup.the411.life, link into sites-enabled, `certbot --nginx -d backup.the411.life`
# (HTTP-01 on the PRIMARY address - this is one of the411's ordinary sites, not a relay name), `nginx -t`, reload.
# Why a dedicated name and not the relay domain: docs/knowledge/offbox-backup.md section 2 (decision).
#
# rest-server authenticates (htpasswd, bcrypt) and confines each household to /<hid>/; nginx only terminates TLS and
# bounds the abuse surface. Do not add caching or request buffering: restic uploads packs of up to 128 MiB.

limit_req_zone $binary_remote_addr zone=zoe_backup:10m rate=20r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name backup.the411.life;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/backup.the411.life/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/backup.the411.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        limit_req zone=zoe_backup burst=200 nodelay;
        proxy_pass http://127.0.0.1:8730;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
    }
}
