# STAGE 2 of 2 — final reverse proxy for Headscale (control plane + embedded DERP).
# Install as its own file (never edit an existing site's nginx file):
#   /etc/nginx/conf.d/hs.the411.life.conf
# Needs the certificate from README step 5 to exist before `nginx -t` passes.
#
# Source: the v0.29.4 reverse-proxy docs (docs/ref/integration/reverse-proxy.md,
# "Nginx"). Changes from the docs example are marked [CHANGED]:
#   [CHANGED] names are hs_-prefixed. This host already serves other sites, and
#             a second `map` for $connection_upgrade or a second `upstream
#             headscale` would stop `nginx -t` with a duplicate-name error.
#   [CHANGED] no `http2 on;` — that directive needs nginx >= 1.25.1 and Ubuntu
#             24.04 ships 1.24. The Tailscale control protocol and DERP are
#             HTTP/1.1 Upgrade connections, so HTTP/2 buys nothing here.
#   [CHANGED] long proxy timeouts (below).
#   [CHANGED] ACME webroot location, so certbot renewals keep working.
#
# Cloudflare: hs.the411.life must be DNS-only (grey cloud). The Cloudflare proxy
# does not support the WebSocket POST the Tailscale protocol uses (headscale
# issue 1468), and the embedded DERP needs a direct path.

upstream hs_upstream {
    server 127.0.0.1:18080 max_fails=1 fail_timeout=5s;
    keepalive 2;
}

# Tailscale clients upgrade with `Upgrade: tailscale-control-protocol` (POST) and
# DERP with `Upgrade: DERP`; pass whatever the client sent.
map $http_upgrade $hs_connection_upgrade {
    default keep-alive;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hs.the411.life;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tailscale captive-portal detection.
    location = /generate_204 {
        return 204;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hs.the411.life;

    ssl_certificate     /etc/letsencrypt/live/hs.the411.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.the411.life/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hs_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header True-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # [CHANGED] The control stream and DERP connections are long-lived and can
        # sit idle for about a minute; the default 60 s nginx read timeout would
        # cut upgraded connections at exactly that boundary.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://hs_upstream;
    }
}
