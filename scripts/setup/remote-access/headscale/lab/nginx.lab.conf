# Lab-only top-level nginx.conf (the shipped nginx-hs.the411.life.conf is an
# http-context snippet; lab_test.sh renders it to hs.conf and includes it below).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/c;
    proxy_temp_path /tmp/p;
    fastcgi_temp_path /tmp/f;
    uwsgi_temp_path /tmp/u;
    scgi_temp_path /tmp/s;
    include /etc/nginx/conf.d/hs.conf;
}

# Production publishes UDP 3478 straight from the headscale container; the lab
# has no host publish, so this relays it purely so netcheck can reach STUN.
stream {
    server {
        listen 3478 udp;
        proxy_pass headscale:3478;
    }
}
