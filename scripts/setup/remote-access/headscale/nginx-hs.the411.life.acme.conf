# STAGE 1 of 2 — HTTP-only server for hs.the411.life, used ONLY to obtain the
# first Let's Encrypt certificate (README step 5). Replace it with
# nginx-hs.the411.life.conf (stage 2) once the certificate exists: the final
# file already contains this :80 block, so do not keep both.
#
# Install as its own file, never inside an existing site's nginx file:
#   /etc/nginx/conf.d/hs.the411.life.conf   (or sites-available + a symlink)
server {
    listen 80;
    listen [::]:80;
    server_name hs.the411.life;

    # certbot --webroot writes challenge files here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
