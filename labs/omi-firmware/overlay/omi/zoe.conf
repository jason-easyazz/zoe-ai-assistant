# Zoe phase-2 firmware - appended to upstream omi.conf by build.sh (later lines win).
# Design: labs/omi-firmware/README.md. Nothing here touches partitions, MCUboot, sysbuild or the net core.

CONFIG_ZOE_BLE_BONDED_ONLY=y
CONFIG_ZOE_RING_ENCRYPT=y

# Bonding: LE Secure Connections only, one persistent bond, the app gates every pairing request.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# The Pi re-pairing from its own address ("replace") needs its old keys overwritten without bt_unpair disconnecting it
# mid-pairing. Safe here: every pairing needs the button window and crypto-wipes the pendant first (zoe_ble_sec.c).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# The MCUmgr SMP (OTA) service needs an encrypted link too: a stranger can no longer push an image signed with the public key.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y

# Ring encryption backend.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CTR=y

# 4th component = Zoe build number (upstream uses three). omi-sync reads the first three (ring path); the panel's
# version_tuple accepts four, so this sorts above stock 3.0.21 and the pinned stock update is never offered over it.
CONFIG_BT_DIS_FW_REV_STR="3.0.21.1"
